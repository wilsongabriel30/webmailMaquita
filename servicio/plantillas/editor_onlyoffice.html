<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor — Almacén Maquita</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; padding:0; height:100%; background:#f1f3f4;
               font-family: Arial, Helvetica, sans-serif; }
  #contenedor { position:absolute; top:0; bottom:0; left:0; right:0; }
  #editor { width:100%; height:100%; }
  #estado { position:absolute; top:40%; left:0; right:0; text-align:center;
            color:#5f6368; font-size:15px; line-height:1.7; padding:0 24px; }
</style>
</head>
<body>
<!-- La franja blanca superior se retiró el 2026-07-29 (decisión de dirección):
     no aportaba nada y comía 44 px de alto útil.
       · El logo de Maquita ya está EN la cabecera del propio editor (los SVG del
         Document Server, ver marca-maquita-onlyoffice-20260729.md).
       · El nombre del archivo lo muestra OnlyOffice centrado en esa misma barra.
       · El botón «Cerrar» lo sustituye «Volver a Drive Maquita», que se envía en
         customization.goback y regresa a la carpeta contenedora.
     Se conserva #nombre-archivo oculto porque el JavaScript de abajo le escribe
     el nombre; quitarlo daría un error al cargar. -->
<span id="nombre-archivo" hidden></span>
<div id="contenedor">
  <div id="estado">Cargando el editor&hellip;</div>
  <div id="editor"></div>
</div>
<script>
(async function () {
  const parametros = new URLSearchParams(location.search);
  let ruta = parametros.get('ruta') || '';
  const nombre = ruta.split('/').pop() || 'Documento';
  document.title = nombre + ' — Almacén Maquita';
  document.getElementById('nombre-archivo').textContent = nombre;
  const estado = document.getElementById('estado');
  let docEditor = null;
  let historialCache = null;   // versiones antiguas (para mapear version → version_id)

  function fallo(mensaje) {
    estado.innerHTML = '<b>No se pudo abrir el editor</b><br>' + mensaje;
  }

  if (!ruta) { return fallo('Falta la ruta del archivo.'); }

  // 1. Configuración firmada del motor del Almacén
  let data;
  try {
    const r = await fetch('/api/almacen/onlyoffice/config?ruta=' + encodeURIComponent(ruta));
    data = await r.json();
  } catch (e) { return fallo('Sin conexión con el Almacén.'); }
  if (!data.success) { return fallo(data.error || 'Error obteniendo la configuración.'); }
  // Formato antiguo (.doc/.xls/.ppt) convertido al moderno: se trabaja sobre el
  // archivo nuevo (el antiguo fue a la papelera). Se actualiza nombre y URL.
  if (data.ruta_abierta && data.ruta_abierta !== ruta) {
    ruta = data.ruta_abierta;
    const nombreNuevo = ruta.split('/').pop();
    document.title = nombreNuevo + ' — Almacén Maquita';
    document.getElementById('nombre-archivo').textContent = nombreNuevo;
    try { history.replaceState(null, '', '?ruta=' + encodeURIComponent(ruta)); } catch (e) {}
    if (data.convertido_ahora) {
      const aviso = document.createElement('div');
      aviso.textContent = '«' + nombreNuevo + '» ya está listo para editar en línea (formato moderno). El archivo antiguo quedó en la papelera por si lo necesitas.';
      aviso.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:8px;font:14px system-ui,sans-serif;z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,.3)';
      document.body.appendChild(aviso);
      setTimeout(function () { aviso.remove(); }, 9000);
    }
  }

  // 2. Cargar api.js del Document Server dedicado
  try {
    await new Promise((listo, error) => {
      const s = document.createElement('script');
      s.src = (data.api_js_url || '').replace(/^https?:\/\/[^\/]+/, location.origin);
      s.onload = listo;
      s.onerror = error;
      document.head.appendChild(s);
    });
  } catch (e) {
    return fallo('No responde el servidor de documentos.<br>' +
                 'Verifica que la VM de OnlyOffice esté encendida.');
  }

  // 3. Eventos "estilo Drive": historial, usuarios (proteger rango) y
  //    referencias entre libros. Cada evento habla con /api/almacen/onlyoffice/*.
  const config = data.config;
  config.events = {
    onAppReady: function () { estado.style.display = 'none'; },
    onError: function (e) {
      fallo('Error del editor: ' + JSON.stringify(e && e.data));
    },

    // ── Usuarios reales para "Proteger rango" y menciones ──
    onRequestUsers: async function (evt) {
      try {
        const r = await fetch('/api/almacen/onlyoffice/usuarios');
        const d = await r.json();
        docEditor.setUsers({ c: (evt.data && evt.data.c) || 'protect',
                             users: d.usuarios || [] });
      } catch (e) { /* sin usuarios: el editor sigue */ }
    },

    // ── Historial de versiones dentro del editor ──
    onRequestHistory: async function () {
      try {
        const r = await fetch('/api/almacen/onlyoffice/historial?ruta=' + encodeURIComponent(ruta));
        const d = await r.json();
        if (!d.success) return;
        historialCache = d.versiones || [];
        docEditor.refreshHistory({ currentVersion: d.currentVersion, history: d.history });
      } catch (e) { /* historial no disponible */ }
    },
    onRequestHistoryData: async function (evt) {
      const version = evt.data;   // número de versión pedido (1..N+1)
      // versiones antiguas: 1..N → version_id; la N+1 es la ACTUAL (sin id)
      const antigua = historialCache && historialCache[version - 1];
      const q = '?ruta=' + encodeURIComponent(ruta) + '&version=' + version +
                (antigua ? '&version_id=' + encodeURIComponent(antigua.version_id) : '');
      try {
        const r = await fetch('/api/almacen/onlyoffice/historial/datos' + q);
        const d = await r.json();
        docEditor.setHistoryData(d);
      } catch (e) { /* sin datos de esa versión */ }
    },
    onRequestHistoryClose: function () { location.reload(); },
    onRequestRestore: async function (evt) {
      const version = evt.data && evt.data.version;
      const antigua = historialCache && historialCache[version - 1];
      if (!antigua) return;
      try {
        await fetch('/api/almacen/onlyoffice/restaurar?ruta=' + encodeURIComponent(ruta), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ version_id: antigua.version_id })
        });
      } finally { location.reload(); }   // key nueva → recarga con lo restaurado
    },

    // ── Referencias entre libros (estilo IMPORTRANGE / pegar con vínculo) ──
    onRequestReferenceData: async function (evt) {
      try {
        const r = await fetch('/api/almacen/onlyoffice/referencia', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(evt.data || {})
        });
        const d = await r.json();
        if (d && d.token) docEditor.setReferenceData(d);
      } catch (e) { /* referencia no disponible */ }
    }
  };
  docEditor = new DocsAPI.DocEditor('editor', config);
})();
</script>
</body>
</html>
