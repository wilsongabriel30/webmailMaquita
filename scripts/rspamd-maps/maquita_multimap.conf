# ============================================
# REGLAS PROPIAS MAQUITA — Rspamd Multimap
# ============================================
# Sistema de reputacion interno (reemplaza DNSBL externas)
# NUNCA rechaza correos — solo agrega score para clasificar
# ============================================

# --- LISTA NEGRA: Dominios de remitentes ---
# Score +10: casi seguro va a Junk (threshold es 6)
MAQUITA_BLACKLIST_DOMAIN {
  type = "from";
  map = "/etc/rspamd/local.d/maps/blacklist_domains.map";
  filter = "email:domain";
  score = 10.0;
  description = "Dominio en lista negra Maquita";
}

# --- LISTA NEGRA: IPs de origen ---
# Score +8: probablemente va a Junk
MAQUITA_BLACKLIST_IP {
  type = "ip";
  map = "/etc/rspamd/local.d/maps/blacklist_ips.map";
  score = 8.0;
  description = "IP en lista negra Maquita";
}

# --- WHITELIST: Dominios confiables ---
# Score -5: reduce probabilidad de falso positivo
WHITELIST_SENDER_DOMAIN {
  type = "from";
  map = "/etc/rspamd/local.d/maps/whitelist_domains.map";
  filter = "email:domain";
  score = -5.0;
  description = "Dominio en whitelist Maquita";
}

# --- WHITELIST: Remitentes especificos ---
WHITELIST_SENDER {
  type = "from";
  map = "/etc/rspamd/local.d/maps/whitelist_senders.map";
  score = -10.0;
  description = "Remitente en whitelist Maquita";
}

# --- HEURISTICA: Correo sin DKIM ni SPF ---
# Si no tiene DKIM y no tiene SPF, probablemente no es legitimo
# Score +3: sospechoso pero no definitivo
MAQUITA_NO_AUTH {
  type = "header";
  header = "Authentication-Results";
  map = "/etc/rspamd/local.d/maps/no_auth_patterns.map";
  regexp = true;
  score = 3.0;
  description = "Correo sin DKIM ni SPF valido";
}

# --- HEURISTICA: Headers sospechosos ---
# Correos con X-Mailer de herramientas de spam conocidas
MAQUITA_SPAM_MAILER {
  type = "header";
  header = "X-Mailer";
  map = "/etc/rspamd/local.d/maps/spam_mailers.map";
  regexp = true;
  score = 5.0;
  description = "Enviado con herramienta de spam conocida";
}

# --- HEURISTICA: Asuntos tipicos de spam ---
MAQUITA_SPAM_SUBJECT {
  type = "header";
  header = "Subject";
  map = "/etc/rspamd/local.d/maps/spam_subjects.map";
  regexp = true;
  score = 4.0;
  description = "Asunto tipico de spam";
}

# --- LISTA GRIS: Dominios sospechosos (no tan seguros como blacklist) ---
# Score +4: requiere mas evidencia para ir a Junk
MAQUITA_GREYLIST_DOMAIN {
  type = "from";
  map = "/etc/rspamd/local.d/maps/greylist_domains.map";
  filter = "email:domain";
  score = 4.0;
  description = "Dominio en lista gris Maquita (sospechoso)";
}
