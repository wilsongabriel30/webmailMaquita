# Bloque proxy para API de Compliance en admin panel (port 8443)
# Este bloque va dentro del server block de admin.example.org (listen 8443)
# Redirige peticiones de compliance del admin panel al backend webmail

location /api/compliance/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host mail.example.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
