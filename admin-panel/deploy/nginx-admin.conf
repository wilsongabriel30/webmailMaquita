server {
    listen 8443 ssl;
    # Redirigir HTTP plano a HTTPS (cuando escriben http:// en puerto SSL)
    error_page 497 301 =301 https://$host:$server_port$request_uri;
    client_max_body_size 5m;
    http2 on;
    server_name __MAIL_HOST__;

    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:!aNULL:!MD5:!DSS;
    ssl_prefer_server_ciphers on;

    root /opt/maquita-webmail/admin-panel/frontend/dist;
    index index.html;

    # Protección: IP interna o auth_basic
    satisfy any;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 127.0.0.1;
    deny all;
    auth_basic "Maquita Admin — Acceso Restringido";
    auth_basic_user_file /etc/nginx/.htpasswd_admin;

    # Rspamd UI — mismo auth que admin, sin doble login
    location /rspamd/ {
        proxy_pass http://127.0.0.1:11334/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Impersonate → webmail backend (port 8000)
    location /api/auth/impersonate {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compliance API → webmail backend (port 8000)
    location /api/compliance/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host __MAIL_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Admin API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Assets con hash en nombre — cache largo (Vite genera nombres unicos por build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # SPA fallback — no cachear index.html para que siempre cargue el JS mas reciente
    # Favicon — servir SVG para /favicon.ico también
    location = /favicon.ico {
        alias /opt/maquita-webmail/admin-panel/frontend/dist/favicon.svg;
        add_header Content-Type image/svg+xml;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/admin-access.log;
    error_log /var/log/nginx/admin-error.log;
}
