<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de planos · Drive Maquita</title>
<style>
  :root{ --verde:#2e7d32; --barra:#1b5e20; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:"Segoe UI",Roboto,Arial,sans-serif; background:#eceff1; overflow:hidden; }
  header{ display:flex; align-items:center; gap:12px; padding:8px 14px; background:var(--barra); color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.25); z-index:5; }
  header img{ height:30px; }
  header .nombre{ font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  header .ext{ font-size:11px; background:rgba(255,255,255,.18); padding:2px 8px; border-radius:10px; text-transform:uppercase; }
  .barra{ display:flex; gap:6px; align-items:center; padding:6px 12px; background:#fff; border-bottom:1px solid #d9d9d9; z-index:4; }
  .barra button{ border:1px solid #cfd8dc; background:#f7f9f9; color:#263238; border-radius:6px; padding:5px 11px; font-size:13px; cursor:pointer; }
  .barra button:hover{ background:#e8f5e9; border-color:var(--verde); }
  .barra .sep{ flex:1; }
  #escena{ position:absolute; inset:96px 0 0 0; overflow:hidden; cursor:grab; background:
     linear-gradient(45deg,#e4e8ea 25%,transparent 25%,transparent 75%,#e4e8ea 75%),
     linear-gradient(45deg,#e4e8ea 25%,#eceff1 25%,#eceff1 75%,#e4e8ea 75%);
     background-size:22px 22px; background-position:0 0,11px 11px; }
  #escena.arrastrando{ cursor:grabbing; }
  #lienzo{ position:absolute; top:0; left:0; transform-origin:0 0; }
  #lienzo svg{ display:block; background:#fff; box-shadow:0 0 0 1px #b0bec5, 0 6px 24px rgba(0,0,0,.18); }
  #estado{ position:absolute; inset:96px 0 0 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#546e7a; }
  .spin{ width:38px; height:38px; border:4px solid #cfd8dc; border-top-color:var(--verde); border-radius:50%; animation:g 1s linear infinite; }
  @keyframes g{ to{ transform:rotate(360deg); } }
  #estado .msg{ font-size:14px; max-width:440px; text-align:center; line-height:1.5; }
  #estado.err .spin{ display:none; }
  @media print{
    header,.barra,#estado{ display:none !important; }
    #escena{ position:static; inset:auto; background:#fff; overflow:visible; }
    #lienzo{ position:static; transform:none !important; }
    #lienzo svg{ box-shadow:none; max-width:100%; }
  }
</style>
</head>
<body>
<header>
  <img src="/static/uploads/logos/logo_20251215_113025_maquita_logo.png" alt="Maquita" onerror="this.style.display='none'">
  <span class="nombre" id="nombre">Plano</span>
  <span class="ext" id="ext"></span>
</header>
<div class="barra">
  <button id="mas" title="Acercar">＋ Acercar</button>
  <button id="menos" title="Alejar">－ Alejar</button>
  <button id="ajustar" title="Ajustar a la pantalla">⤢ Ajustar</button>
  <span id="zoom" style="font-size:12px;color:#607d8b;min-width:48px;text-align:center">100 %</span>
  <span class="sep"></span>
  <button id="imprimir" title="Imprimir o guardar como PDF">🖨 Imprimir / PDF</button>
  <button id="volver" title="Volver al Drive">✕ Cerrar</button>
</div>
<div id="escena"><div id="lienzo"></div></div>
<div id="estado"><div class="spin"></div><div class="msg">Cargando plano…</div></div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var ruta = params.get('ruta') || '';
  var nombre = ruta.split('/').pop() || 'Plano';
  var ext = (nombre.indexOf('.')>=0 ? nombre.split('.').pop() : '').toUpperCase();
  document.getElementById('nombre').textContent = nombre;
  document.getElementById('ext').textContent = ext;
  document.title = nombre + ' · Drive Maquita';

  var escena = document.getElementById('escena');
  var lienzo = document.getElementById('lienzo');
  var estado = document.getElementById('estado');
  var zoomLbl = document.getElementById('zoom');
  var escala = 1, tx = 0, ty = 0;

  function aplicar(){
    lienzo.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+escala+')';
    zoomLbl.textContent = Math.round(escala*100) + ' %';
  }
  function ajustar(){
    var svg = lienzo.querySelector('svg'); if(!svg) return;
    var r = escena.getBoundingClientRect();
    var w = svg.clientWidth || svg.getBoundingClientRect().width || 800;
    var h = svg.clientHeight || svg.getBoundingClientRect().height || 600;
    var m = 40;
    escala = Math.min((r.width-m)/w, (r.height-m)/h);
    if(!isFinite(escala) || escala<=0) escala = 1;
    tx = (r.width - w*escala)/2;
    ty = (r.height - h*escala)/2;
    aplicar();
  }
  function zoomEn(factor, cx, cy){
    var r = escena.getBoundingClientRect();
    cx = (cx==null? r.width/2 : cx-r.left); cy = (cy==null? r.height/2 : cy-r.top);
    var nueva = Math.min(60, Math.max(0.02, escala*factor));
    var k = nueva/escala;
    tx = cx - (cx - tx)*k;  ty = cy - (cy - ty)*k;
    escala = nueva;  aplicar();
  }

  document.getElementById('mas').onclick   = function(){ zoomEn(1.25); };
  document.getElementById('menos').onclick = function(){ zoomEn(0.8); };
  document.getElementById('ajustar').onclick = ajustar;
  document.getElementById('imprimir').onclick = function(){ window.print(); };
  document.getElementById('volver').onclick = function(){
    if(history.length>1) history.back(); else location.href='/archivos-almacen';
  };

  escena.addEventListener('wheel', function(e){
    e.preventDefault(); zoomEn(e.deltaY<0?1.12:0.89, e.clientX, e.clientY);
  }, {passive:false});
  var ax=false, px=0, py=0;
  escena.addEventListener('mousedown', function(e){ ax=true; px=e.clientX; py=e.clientY; escena.classList.add('arrastrando'); });
  window.addEventListener('mousemove', function(e){ if(!ax) return; tx+=e.clientX-px; ty+=e.clientY-py; px=e.clientX; py=e.clientY; aplicar(); });
  window.addEventListener('mouseup', function(){ ax=false; escena.classList.remove('arrastrando'); });

  function fallo(txt){
    estado.className='err';
    estado.innerHTML='<div class="msg">⚠ '+txt+'</div>'
      +'<button onclick="location.reload()" style="padding:6px 14px;border:1px solid #cfd8dc;border-radius:6px;background:#f7f9f9;cursor:pointer">Reintentar</button>';
  }

  if(!ruta){ fallo('No se indicó el plano a mostrar.'); return; }

  fetch('/api/almacen/cad/svg?ruta=' + encodeURIComponent(ruta), {credentials:'same-origin'})
    .then(function(r){
      if(!r.ok){ return r.json().catch(function(){return {};}).then(function(j){ throw new Error(j.error || ('Error '+r.status)); }); }
      return r.text();
    })
    .then(function(svg){
      lienzo.innerHTML = svg;
      var el = lienzo.querySelector('svg');
      if(el){ el.removeAttribute('width'); el.removeAttribute('height'); el.style.width=(el.viewBox && el.viewBox.baseVal && el.viewBox.baseVal.width? el.viewBox.baseVal.width:900)+'px'; el.style.height='auto'; }
      estado.style.display='none';
      requestAnimationFrame(ajustar);
    })
    .catch(function(e){ fallo(e.message || 'No se pudo cargar el plano.'); });
})();
</script>
</body>
</html>
