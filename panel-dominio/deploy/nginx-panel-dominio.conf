# Portal de administradores de dominio — puerto propio, separado del panel general (8443).
# Entrar con segundo factor son dos peticiones (clave, y clave con código). La fuerza bruta la
# frena además el bloqueo de la cuenta: cinco fallos, quince minutos.
limit_req_zone $binary_remote_addr zone=pd_entrar:5m rate=12r/m;
limit_req_zone $binary_remote_addr zone=pd_api:5m rate=300r/m;

server {
    listen 8444 ssl;
    http2 on;
    server_name correo.ejemplo.org;  # el o los nombres de tu servidor

    ssl_certificate /etc/letsencrypt/live/correo.ejemplo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/correo.ejemplo.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    server_tokens off;

    root /opt/maquita-webmail/panel-dominio/frontend;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache" always;

    location = /api/acceso/entrar {
        limit_req zone=pd_entrar burst=8 nodelay;
        limit_req_status 429;
        include snippets/panel-dominio-proxy.conf;
    }
    # Sin barra final: con ella nginx redirige /api/marca a /api/marca/ y el navegador lo bloquea.
    location /api/marca {
        client_max_body_size 1m;   # logos e iconos
        limit_req zone=pd_api burst=120 nodelay;
        limit_req_status 429;
        include snippets/panel-dominio-proxy.conf;
    }
    # >>> sitios web (maquita-sitios-portal)
    # Paquetes propios de hasta 512 MB (520m: el tope del portal, PD_SUBIDA_MAX_MB, más margen) e
    # instalaciones de aplicaciones que tardan minutos. El resto de /api/ sigue con 64 KB y 30 s.
    # Sin barra final, por lo mismo que /api/marca (GET y POST /api/sitios también llegan aquí).
    location /api/sitios {
        client_max_body_size 520m;
        proxy_request_buffering off;
        limit_req zone=pd_api burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host panel-dominio.interno;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # «Bases → Entrar»: phpMyAdmin y Adminer con vale de un solo uso (si están instalados).
    include /etc/nginx/snippets/herramientas-bd-rutas*.conf;
    # <<< sitios web
    location /api/ {
        limit_req zone=pd_api burst=120 nodelay;
        limit_req_status 429;
        include snippets/panel-dominio-proxy.conf;
    }
    location / {
        try_files $uri /index.html;
    }
    location ~ /\. { deny all; }
}
