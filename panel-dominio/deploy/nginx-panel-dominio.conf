# Portal de administradores de dominio — puerto propio, separado del panel general (8443).
limit_req_zone $binary_remote_addr zone=pd_entrar:5m rate=6r/m;
limit_req_zone $binary_remote_addr zone=pd_api:5m rate=120r/m;

server {
    listen 8444 ssl;
    http2 on;
    server_name correo.ejemplo.org;  # el o los nombres de tu servidor

    ssl_certificate /etc/letsencrypt/live/correo.ejemplo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/correo.ejemplo.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    server_tokens off;

    root /opt/webmail/panel-dominio/frontend;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache" always;

    location = /api/acceso/entrar {
        limit_req zone=pd_entrar burst=4 nodelay;
        limit_req_status 429;
        include snippets/panel-dominio-proxy.conf;
    }
    location /api/ {
        limit_req zone=pd_api burst=60 nodelay;
        limit_req_status 429;
        include snippets/panel-dominio-proxy.conf;
    }
    location / {
        try_files $uri /index.html;
    }
    location ~ /\. { deny all; }
}
