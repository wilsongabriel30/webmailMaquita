# Buzon virtual "Todo el correo" (16/09/2026): una sola busqueda IMAP recorre todas las
# carpetas de la persona (entrada, enviados, papelera, spam, expurgados y propias).
# No se lista (list = no): el webmail lo usa solo al buscar en todas las carpetas.
mail_plugins {
  virtual = yes
}
namespace virtual {
  prefix = Virtual.
  separator = .
  mail_driver = virtual
  mail_path = /etc/dovecot/virtual
  mail_index_path = /var/vmail/%{user|domain}/%{user|username}/virtual-index
  list = no
  subscriptions = no
  hidden = yes
}
