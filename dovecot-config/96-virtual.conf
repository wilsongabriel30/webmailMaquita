# Buzon virtual "Todo el correo" (16/09/2026): una sola busqueda IMAP recorre todas las
# carpetas de la persona (entrada, enviados, papelera, spam, expurgados y propias).
# No se lista (list = no): el webmail lo usa solo al buscar en todas las carpetas.
#
# Instalacion (una vez):
#   install -d -o root -g vmail -m 755 /etc/dovecot/virtual/Todo
#   printf '*\n-Virtual.*\n  all\n' > /etc/dovecot/virtual/Todo/dovecot-virtual
#   install -o root -g vmail -m 644 /dev/null /etc/dovecot/virtual/dovecot-acl-list
# El ultimo archivo (vacio) hace falta: sin el, el plugin acl intenta crearlo en cada entrega
# y en cada acceso, y como Dovecot no puede escribir en /etc (ProtectSystem de systemd) deja
# dos errores «Read-only file system» cada vez. El buzon virtual no comparte nada: vacio es lo correcto.
mail_plugins {
  virtual = yes
}
namespace virtual {
  prefix = Virtual.
  separator = .
  mail_driver = virtual
  mail_path = /etc/dovecot/virtual
  mail_index_path = /var/vmail/%{user|domain}/%{user|username}/virtual-index
  list = no
  subscriptions = no
  hidden = yes
  # El indice de la lista de buzones iria a mail_path (/etc, solo lectura): se desactiva.
  mailbox_list_index = no
}
