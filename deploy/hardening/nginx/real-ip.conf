# IP REAL detrás de reverse-proxy — CRÍTICO para risky_login (viaje imposible),
# auditoría y fail2ban. Sin esto el backend ve la IP del proxy y TODO parece
# "interno": el viaje imposible queda CIEGO y la auditoría registra IPs erróneas.
#
# Incluir dentro del server { } del webmail. Ajustar la IP del proxy de borde.
set_real_ip_from CHANGEME_PROXY_IP;   # IP del reverse-proxy/router que reenvía (ej: 192.168.1.1)
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
# El proxy/upstream DEBE enviar la cabecera:
#   proxy_set_header X-Real-IP        $remote_addr;
#   proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
#
# Verificar: tras un login externo, login_events debe mostrar la IP pública real
# (no la del proxy) y is_internal=false. Si todo sale is_internal=true desde
# fuera, real_ip NO está aplicando.
