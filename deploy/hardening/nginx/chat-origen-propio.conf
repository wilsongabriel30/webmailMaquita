# Origen propio del chat — separación del correo (paso 1 del plan 2026-09-04)
# =============================================================================
# Hoy el chat se sirve bajo mail.maquita.org/chat/. Para el navegador es la MISMA
# aplicación que el webmail, así que cualquier petición suya a /api/mail/* lleva
# la cookie de sesión sola: un XSS almacenado en el chat es lectura completa del
# buzón de quien abra la conversación.
#
# Este vhost le da al chat su propio origen. La política de mismo origen del
# navegador pasa a hacer el trabajo que si no habría que cubrir corrigiendo cada
# agujero del chat uno por uno, y cubre además el próximo que aparezca.
#
# DÓNDE VA: en el proxy de borde (193.16.0.150), que ya tiene el certificado
# comodín *.maquita.org. Así el nginx del correo queda sin nada del chat.
#
# ESTADO: DESPLEGADO el 2026-09-04 (fase A del paso 1). Vive en el borde como
# /etc/nginx/sites-available/mensajeria.maquita.org.conf, enlazado en sites-enabled.
# Respaldo previo del borde: /root/backups-nginx/sites-enabled-20260904-*.tar.gz
#
# NOMBRE: mensajeria.maquita.org. NO se usó chat.maquita.org: en el DNS público no
# existe, pero los resolutores internos lo apuntan a este mismo borde, donde sirve
# Element (el cliente de Matrix), y habría chocado con ese despliegue.
#
# DNS: registro A `mensajeria` -> 179.49.24.168, TTL 3600. Creado en Centinela
# (zona maquita.org, id 1, registro 500) y desplegado con serial 2026090402, según
# la regla interna REGLAS-CENTINELA-DNS (nunca editar BIND a mano). Verificado en
# los dos secundarios, en las tres IP públicas de NS y en 1.1.1.1. Es la misma IP
# que ya usan datos, faro, crm, ia y proxy: no hizo falta IP ni NAT nuevos.
#
# CORTAFUEGOS de la VM 136: se añadió 193.16.0.150 al conjunto que puede alcanzar
# 8790/8791, que antes solo admitía al correo y a Raíces.
# Respaldo: /etc/nftables.conf.bak.20260904-0941
#
# COMPROBADO tras desplegar: /chat/ responde 401 por el nombre nuevo (el servicio
# contesta; sin sesión todavía, que es lo esperado hasta la fase B), la cabecera
# frame-ancestors llega, el certificado servido es el comodín, y mail.maquita.org
# /chat/ sigue respondiendo igual que antes.

server {
    listen 80;
    listen [::]:80;
    server_name mensajeria.maquita.org;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mensajeria.maquita.org;

    # Comodín ya existente en el borde: no hace falta emitir certificado nuevo.
    ssl_certificate     /etc/ssl/wildcard-maquita/fullchain.pem;
    ssl_certificate_key /etc/ssl/wildcard-maquita/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:CHATPROPIO:10m;
    ssl_session_tickets off;

    client_max_body_size 64M;

    # El chat se embebe dentro del webmail, así que NO puede llevar
    # X-Frame-Options: DENY. El control equivalente y más preciso es
    # frame-ancestors: solo el correo puede enmarcarlo.
    add_header Content-Security-Policy "frame-ancestors https://mail.maquita.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://193.16.0.136:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Socket.IO: el tiempo real del chat. Requiere upgrade de conexión.
    # OJO (A-6): mientras el servidor de Socket.IO siga con cors_allowed_origins="*"
    # y credenciales, este origen nuevo acepta peticiones de cualquier sitio y
    # ahora tiene sesión propia dentro. La lista blanca de orígenes debe entrar
    # en el MISMO despliegue que esta separación.
    location /socket.io/ {
        proxy_pass http://193.16.0.136:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# -----------------------------------------------------------------------------
# ORDEN DE DESPLIEGUE (para no cortar el chat a nadie)
#
# A. Aditivo, sin riesgo: registro DNS, línea del cortafuegos y este vhost.
#    A partir de aquí el chat responde por los DOS orígenes. Nada se rompe.
# B. Sesión propia del chat: intercambio de credencial con audiencia propia y
#    cookie propia en el origen nuevo, con SECRETO PROPIO. Mientras compartan
#    secreto con el correo, comprometer el chat sigue comprometiendo el correo.
#    Sin este paso el chat en el origen nuevo no autentica: la cookie del correo
#    es host-only y no viaja.
# C. Frontend del correo: apuntar embed_url al origen nuevo (ya es configurable,
#    /api/chat-config), ajustar la comprobación de origen del postMessage en
#    ChatFlotante.tsx:98 y mover el contador de no leídos a postMessage
#    (ChatFlotante.tsx:47-72), en vez de la llamada directa a /api/chat/.
# D. Recién entonces, quitar del nginx del correo: /chat/, /api/chat/,
#    /socket.io/, /static/js/chat-, /static/css/chat-, /static/uploads/chat/
#    y el proxy cruzado /uploads/ hacia Raíces. Dejar redirecciones 301.
#
# LO QUE ESTO NO ARREGLA: contiene el daño, no arregla el chat. Siguen abiertos
# los adjuntos sin sesión (A-2), la suscripción a salas ajenas (A-3), la lectura
# de cualquier mensaje por id (A-4) y las grabaciones enumerables (A-5).
# -----------------------------------------------------------------------------
