# =============================================================================
# nginx — Integraciones externas del webmail (asistente de IA, transcripción,
# dictado por WebSocket) SOLO con sesión válida del webmail.
# Incluir dentro del bloque server de mail (server { include .../integraciones-sesion.conf; }).
# =============================================================================
# Las claves que nginx inyecta hacia las integraciones viven en un archivo aparte
# con permisos 640 (no versionado), por ejemplo /etc/nginx/snippets/claves-integraciones.conf:
#     set $clave_ia "…";
#     set $clave_whisper "…";
# include snippets/claves-integraciones.conf;

# Validación de sesión: el backend responde 200 (+ X-Remote-User) o 401.
location = /_auth_sesion {
    internal;
    proxy_pass http://webmail_api/api/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Original-URI $request_uri;
}

