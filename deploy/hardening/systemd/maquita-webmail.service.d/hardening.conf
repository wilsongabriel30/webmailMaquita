# =============================================================================
# Endurecimiento de systemd para maquita-webmail.service (OPCIONAL)
# Archivo: /etc/systemd/system/maquita-webmail.service.d/hardening.conf
# =============================================================================
# Aplicar:    systemctl daemon-reload && systemctl restart maquita-webmail
# Verificar:  sudo bash deploy/tools/validar-despliegue.sh   (comprueba que sudo sigue funcionando)
#
# 16/11/2026 (informe de Andes): la versión anterior de este archivo traía NoNewPrivileges=yes y
# CapabilityBoundingSet= vacío. Con eso «sudo» no puede ejecutarse dentro del servicio y dejan de
# funcionar, SIN ERROR VISIBLE, todas las funciones que pasan por /usr/local/sbin/maquita-sudo:
# recuperar un correo enviado por error (propio y entre servidores), restaurar borrados, búsquedas
# de cumplimiento, cola de Postfix y bloqueos. Si su instalación tiene la versión anterior,
# reemplácela por esta y reinicie el servicio.
# =============================================================================

[Service]

# --- Privilegios ---
# El backend corre como www-data y llama a «sudo -n /usr/local/sbin/maquita-sudo …» (orden única,
# acotada en /etc/sudoers.d/). sudo necesita poder elevar: NoNewPrivileges debe quedar en «no».
NoNewPrivileges=no

# Solo las capacidades que sudo necesita para cambiar de usuario. Sin ellas sudo tampoco funciona.
CapabilityBoundingSet=CAP_SETUID CAP_SETGID

# --- Sistema de archivos ---
PrivateTmp=yes
# / en solo lectura; se escribe únicamente en las rutas de ReadWritePaths.
ProtectSystem=strict
ProtectHome=yes

# El guion delante de una ruta la hace opcional (no falla si no existe en esta instalación).
#   /opt/maquita-webmail            aplicación (subidas, caché)
#   /var/log                        registros
#   /var/lib/maquita-webmail        datos del servicio
#   /var/lib/maquita-compliance     exportaciones de cumplimiento
#   /var/vmail                      buzones: lo que hace doveadm vía maquita-sudo hereda este aislamiento
#   /etc/rspamd/local.d/maps        listas de bloqueo que edita el panel
ReadWritePaths=/opt/maquita-webmail /var/log
ReadWritePaths=-/var/lib/maquita-webmail -/var/lib/maquita-compliance -/var/vmail -/etc/rspamd/local.d/maps

# --- Núcleo ---
RestrictNamespaces=yes
RestrictRealtime=yes

# --- Recursos ---
# Sin topes aquí: MemoryMax=2G y TasksMax=100 de la versión anterior eran un límite oculto que tiraba
# el servicio con carga real. Si quiere topes, fíjelos según la memoria y los procesos de su servidor.
