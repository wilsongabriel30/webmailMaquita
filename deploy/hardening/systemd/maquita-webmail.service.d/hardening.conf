# =============================================================================
# Systemd Hardening — Override para maquita-webmail.service
# Archivo: /etc/systemd/system/maquita-webmail.service.d/hardening.conf
# =============================================================================
# Este drop-in refuerza el aislamiento del servicio webmail.
# Aplicar cambios: systemctl daemon-reload && systemctl restart maquita-webmail
# Verificar: systemd-analyze security maquita-webmail.service
# =============================================================================

[Service]

# --- Control de privilegios ---

# Impide que el proceso o sus hijos adquieran nuevos privilegios (ej. via setuid)
NoNewPrivileges=yes

# Elimina TODAS las capabilities del proceso. El webmail no necesita ninguna
# (no abre puertos privilegiados, no modifica red, etc.)
CapabilityBoundingSet=

# --- Aislamiento del sistema de archivos ---

# Monta /tmp privado para el servicio, aislado del /tmp del sistema
PrivateTmp=yes

# Monta / como solo-lectura. Solo los paths en ReadWritePaths son escribibles
ProtectSystem=strict

# Oculta /home, /root y /run/user del servicio (no necesita acceder a ellos)
ProtectHome=yes

# Paths donde el servicio SI necesita escribir:
#   - /opt/maquita-webmail: directorio de la aplicacion (uploads, cache, sqlite)
#   - /var/log: logs del servicio
ReadWritePaths=/opt/maquita-webmail /var/log

# --- Restricciones del kernel ---

# Impide crear namespaces (user, network, pid, etc.) — previene escalacion
RestrictNamespaces=yes

# Impide usar scheduling de tiempo real (innecesario para un webmail)
RestrictRealtime=yes

# --- Limites de recursos ---

# Maximo 2 GB de RAM. Previene memory leaks y ataques de agotamiento
MemoryMax=2G

# Maximo 100 tareas/hilos. Limita fork bombs y thread exhaustion
TasksMax=100
