# [A-15, fase 1] Confinamiento del Almacen.
#
# Sigue como root (fase 2 pendiente), pero se le recorta lo que puede hacer.
# Guarda los archivos de todos en /mnt/almacen, y ahi es donde mas dano haria
# un fallo: por eso todo lo demas del sistema queda de solo lectura.
#
# ProtectSystem=full deja /usr, /boot y /etc en solo lectura. El Almacen no
# escribe en /etc, asi que no hace falta devolverle nada de ahi.
# PrivateTmp=yes le da su propio /tmp: la cache de miniaturas
# (/tmp/almacen-previews) sigue funcionando, aislada del /tmp del sistema.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=full
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
ReadWritePaths=/mnt/almacen
ReadWritePaths=/opt/maquita-webmail
ReadWritePaths=-/var/lib/maquita-pdf-editor
