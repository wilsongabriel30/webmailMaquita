# [A-15, fase 1] Confinamiento del panel administrativo.
#
# El panel sigue corriendo como root porque lee buzones en /var/vmail, escribe
# mapas de rspamd y controla ocho servicios. Bajarlo a un usuario sin privilegios
# exige grupos, sudo y cambios de propietario en varias rutas: va en la fase 2,
# con ventana y pruebas.
#
# Mientras tanto se le recorta lo que puede hacer AUNQUE sea root. Este panel ya
# tuvo dos ejecuciones remotas de codigo (C-4 y C-5): si vuelve a aparecer una,
# esto le quita las vias habituales de persistencia y de escalada.
#
# ProtectSystem=full deja /usr, /boot Y /etc en solo lectura. El panel SI escribe
# en /etc (mapas de rspamd, filtro avanzado), asi que esas rutas concretas se
# devuelven con ReadWritePaths: todo lo demas de /etc queda protegido.
# No se pone ProtectHome: gunicorn usa el HOME de root para su socket de control.
[Service]
# NoNewPrivileges NO se activa en el panel: desde la fase 2 corre como `maquita-admin` y
# pide lo poco que necesita con `sudo` sobre /usr/local/sbin/maquita-sudo, que valida
# programa, subcomando y argumentos. `sudo` es un binario con setuid, así que con
# NoNewPrivileges=yes toda orden privilegiada falla («the "no new privileges" flag is set»)
# y el panel no puede ni crear un buzón. Quien acota el privilegio aquí es el envoltorio y
# el sudoers, no este ajuste.
NoNewPrivileges=no
PrivateTmp=yes
ProtectSystem=full
ReadWritePaths=/etc/rspamd/local.d
ReadWritePaths=/etc/maquita-mail
ReadWritePaths=/var/lib/maquita-admin
ReadWritePaths=/var/vmail
ReadWritePaths=/opt/maquita-webmail
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
