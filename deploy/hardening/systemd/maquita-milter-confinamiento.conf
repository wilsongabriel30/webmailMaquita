# [A-15, fase 1] Confinamiento del milter DLP.
#
# Es el servicio que procesa correo HOSTIL: cada mensaje que entra pasa por el.
# Sigue como root (fase 2 pendiente) pero se le recorta todo lo que no necesita.
#
# Su superficie es minima y esta medida: no ejecuta ningun comando externo, no
# usa temporales, y lo unico que escribe es la cola de cuarentena. Por eso aqui
# se puede usar ProtectSystem=strict, que deja TODO el disco de solo lectura
# salvo lo declarado, en vez del `full` de los otros dos servicios.
#
# Habla con Postfix por TCP (127.0.0.1:11335), no por socket de disco, asi que
# no hay permisos de socket que preservar.
#
# Nota operativa: Postfix tiene milter_default_action = accept. Si este servicio
# no responde, el correo PASA SIN INSPECCION; no se detiene la entrega. Ver la
# decision registrada en DECISIONES.md.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/maquita-admin
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
