# Referrer-Policy por ruta (hallazgo F-08). Contexto http: va en /etc/nginx/conf.d/.
# Los enlaces públicos del Almacén llevan el token en la dirección: con «no-referrer» el
# navegador no lo envía a terceros al salir de la página. Si el server{} pusiera su propia
# Referrer-Policy fija, anularía la del servicio; por eso el server{} usa esta variable.
# Instalado por deploy/hardening/seguridad-correo-web/aplicar.sh (ajuste 54).
map $uri $politica_referer {
    default                                  "strict-origin-when-cross-origin";
    ~^/almacen-s/                            "no-referrer";
    ~^/api/almacen/publico                   "no-referrer";
    ~^/api/almacen/onlyoffice/config-public  "no-referrer";
}
