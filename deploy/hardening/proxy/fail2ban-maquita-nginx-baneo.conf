# Acción de fail2ban: bloquear también en nginx (por la IP real), para lo que entra por el proxy de confianza.
# La instala deploy/hardening/proxy/instalar.sh (ajuste 75) en /etc/fail2ban/action.d/maquita-nginx-baneo.conf
# y la suma, con PROXY_CONFIABLE, a las cárceles que leen registros de nginx o del webmail
# (jail.d/zz-maquita-proxy-baneo.local). Detalle: docs/PROXY-CONFIABLE.md.

[Definition]
actionstart = <ayudante> iniciar <name>
actionstop = <ayudante> parar <name>
actionflush = <ayudante> parar <name>
actioncheck =
actionban = <ayudante> banear <name> <ip>
actionunban = <ayudante> desbanear <name> <ip>

[Init]
ayudante = /usr/local/sbin/maquita-nginx-baneo
