# fail2ban action — bloqueo perimetral en TIEMPO REAL en un MikroTik (RouterOS).
# Al banear una IP, la empuja a una address-list del router; al desbanear, la quita.
# El router debe tener una regla raw/filter que dropee esa address-list.
#
# REUTILIZABLE en otra infra: ajustar la seccion [Init] (host, usuario, clave, lista).
# Requisitos previos en el MikroTik (ver deploy/hardening/mikrotik/README.md):
#   - usuario dedicado con clave SSH (grupo policy=ssh,read,write)
#   - address-list (p.ej. blacklist_mail) + regla raw drop sobre ella
#
# Uso en jail.local:
#   action = %(action_)s
#            mikrotik-blacklist

[Definition]
actionstart =
actionstop =
actioncheck =
actionban   = ssh -i <sshkey> -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o PreferredAuthentications=publickey <mtuser>@<mthost> "/ip firewall address-list add list=<addrlist> address=<ip> comment=\"fail2ban <name>\""
actionunban = ssh -i <sshkey> -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o PreferredAuthentications=publickey <mtuser>@<mthost> "/ip firewall address-list remove [find list=<addrlist> address=<ip>]"

[Init]
# Clave SSH privada (sin passphrase) del usuario dedicado en el router
sshkey   = /root/.ssh/mikrotik_sync
# Usuario dedicado del MikroTik (NO usar admin)
mtuser   = CHANGEME_MT_USER
# IP del MikroTik
mthost   = CHANGEME_MIKROTIK_HOST
# address-list destino (debe existir la regla raw que la dropea)
addrlist = blacklist_mail
