# =============================================================================
# Fail2Ban — Filtro personalizado para Maquita Webmail
# Archivo: /etc/fail2ban/filter.d/maquita-webmail.conf
# =============================================================================
# Detecta intentos fallidos de login en la API del webmail.
# El backend (FastAPI/Uvicorn) registra estos eventos en el log cuando
# un usuario falla autenticacion JWT o credenciales IMAP.
#
# Patrones esperados en los logs:
#   - "Authentication failed for user@domain from 1.2.3.4"
#   - "Invalid JWT token from 1.2.3.4"
#   - "Login failed" con IP en formato uvicorn/starlette
#   - HTTP 401 en el endpoint /api/auth/login
#
# Probar filtro: fail2ban-regex /var/log/maquita-webmail/access.log \
#                /etc/fail2ban/filter.d/maquita-webmail.conf
# =============================================================================

[Definition]

# Prefijo comun en logs de uvicorn/journalctl (timestamp + nivel)
# Ejemplo: "2026-05-12 10:30:45,123 WARNING ..."
_daemon = maquita-webmail

# -------------------------------------------------------------------------
# Patrones de fallo de autenticacion
# -------------------------------------------------------------------------
# Cada failregex debe capturar <HOST> (la IP del atacante).

failregex = ^.*Authentication failed for .+ from <HOST>\s*$
            ^.*Login failed for user .+ from <HOST>\s*$
            ^.*Invalid JWT token from <HOST>\s*$
            ^.*Invalid credentials.+client[:\s]+<HOST>\s*$
            ^.*POST /api/auth/login.+401.+<HOST>\s*$
            ^.*\[WARNING\].*auth.*failed.*<HOST>\s*$
            ^<HOST>\s+-\s+.+\"POST /api/auth/login HTTP/\S+\" 401\s
            ^.*Unauthorized access attempt from <HOST>\s*$

# -------------------------------------------------------------------------
# Patrones a ignorar (logins exitosos, health checks, etc.)
# -------------------------------------------------------------------------
ignoreregex = ^.*POST /api/auth/login.+200.*$
              ^.*Health check.*$
              ^.*GET /api/health.*$
