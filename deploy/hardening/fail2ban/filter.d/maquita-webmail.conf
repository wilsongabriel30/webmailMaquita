# =============================================================================
# Fail2Ban — Filtro para Maquita Webmail
# Archivo destino: /etc/fail2ban/filter.d/maquita-webmail.conf
# =============================================================================
# Fuente: el log de seguridad del backend (por defecto /var/log/webmail/security.log,
# configurable con SECURITY_LOG_PATH). El backend registra cada 401/429 del login como:
#   2026-09-03 00:00:16,096 SECURITY_BLOCK status=401 ip=203.0.113.5 method=POST path=/api/auth/login
# y los cortes por límite de peticiones como:
#   2026-09-03 00:00:16,096 SECURITY_EVENT=rate_limit_hit ip=203.0.113.5 path=/api/auth/login
# La IP proviene de X-Real-IP (nginx), por lo que funciona detrás del proxy.
#
# Probar: fail2ban-regex /var/log/webmail/security.log /etc/fail2ban/filter.d/maquita-webmail.conf
# =============================================================================

[Definition]

failregex = ^\s*SECURITY_BLOCK status=(?:401|429) ip=<HOST> method=POST path=/api/auth/login\s*$
            ^\s*SECURITY_EVENT=rate_limit_hit ip=<HOST> path=/api/auth/login\s*$

ignoreregex =
