# Filtro Dovecot 2.4 para fail2ban (Maquita).
# El filtro estandar de fail2ban NO casa el formato de Dovecot 2.4:
#   imap-login: Login aborted: ... (auth failed, N attempts ...) (auth_failed): ... rip=<IP>
# Validado con fail2ban-regex sobre logs reales de produccion.
[Definition]
failregex = -login: .*\(auth failed, \d+ attempts[^\)]*\)[^\n]*\brip=<HOST>(?:,|\s|$)
ignoreregex =
journalmatch = _SYSTEMD_UNIT=dovecot.service
