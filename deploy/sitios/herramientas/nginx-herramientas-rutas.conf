# Herramientas de bases de datos (phpMyAdmin y Adminer). Las incluyen el panel general (8443, por
# herramientas-bd.conf) y el portal de dominio, para que «Bases → Entrar» funcione en los dos.
# Se entra con un vale de un solo uso (60 s) y un usuario temporal de la base (2 h): ver
# deploy/sitios/lib/acceso_bd.py. Instalado en /etc/nginx/snippets/herramientas-bd-rutas.conf.
location = /herramientas/phpmyadmin { return 301 /herramientas/phpmyadmin/; }
location ^~ /herramientas/phpmyadmin/ {
    # Cabeceras propias: así no heredan la CSP estricta del servidor que las incluya (el portal de
    # dominio no admite estilos en línea); phpMyAdmin y Adminer envían la suya.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    alias /usr/share/phpmyadmin/;
    index index.php;
    client_max_body_size 64m;
    location ~ ^/herramientas/phpmyadmin/(?:libraries|templates|setup/lib|vendor)/ { deny all; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/run/php/herramientas-bd.sock;
        fastcgi_read_timeout 300s;
    }
}
location = /herramientas/adminer { return 301 /herramientas/adminer/; }
location ^~ /herramientas/adminer/ {
    # Cabeceras propias: así no heredan la CSP estricta del servidor que las incluya (el portal de
    # dominio no admite estilos en línea); phpMyAdmin y Adminer envían la suya.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    alias /usr/local/share/adminer-panel/;
    index index.php;
    location ~ ^/herramientas/adminer/adminer-plugins/ { deny all; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/run/php/herramientas-bd.sock;
    }
}
