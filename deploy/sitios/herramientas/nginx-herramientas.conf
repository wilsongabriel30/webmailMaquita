# Herramientas de bases de datos dentro del panel (8443): heredan su protección (IP de administración o
# clave del navegador). Lo instala deploy/sitios/instalar.sh; se incluye en el server{} del panel.

# Las instalaciones de aplicaciones (Moodle tarda unos minutos) superan los 120 s de /api/.
location /api/sitios {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1200s;
}
# Subir un paquete propio a un sitio (hasta 512 MB; el panel lo vuelve a limitar).
location ~ ^/api/sitios/[a-z0-9.-]+/paquete$ {
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;
}
location = /herramientas/phpmyadmin { return 301 /herramientas/phpmyadmin/; }
location ^~ /herramientas/phpmyadmin/ {
    alias /usr/share/phpmyadmin/;
    index index.php;
    client_max_body_size 64m;
    location ~ ^/herramientas/phpmyadmin/(?:libraries|templates|setup/lib|vendor)/ { deny all; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/run/php/herramientas-bd.sock;
        fastcgi_read_timeout 300s;
    }
}
location = /herramientas/adminer { return 301 /herramientas/adminer/; }
location ^~ /herramientas/adminer/ {
    alias /usr/local/share/adminer-panel/;
    index index.php;
    location ~ ^/herramientas/adminer/adminer-plugins/ { deny all; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/run/php/herramientas-bd.sock;
    }
}
