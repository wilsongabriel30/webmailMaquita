[Definition]
# .env, .git, copias de configuración, paneles y herramientas que no existen en estos sitios.
# (fail2ban quita la fecha antes de aplicar la expresión y deja «[]».)
failregex = ^<HOST> \[\] "[^"]*" "[A-Z]+ [^" ]*(?:/\.env|/\.git/|/\.aws/|/\.ssh/|wp-config\.php\.|/phpmyadmin|/pma/|/vendor/phpunit/|/cgi-bin/|/boaform/|/\.DS_Store|/server-status|/actuator/|/\.vscode/|/config\.json|/backup\.(?:zip|sql|tar)|/eval-stdin\.php)[^"]*" (?:4\d\d|5\d\d) 
ignoreregex =
