# Sitios web: fail2ban sobre el registro común /var/log/nginx/sitios-acceso.log (formato «sitios»).
# Bloqueo en el cortafuegos del servidor (nftables/iptables según fail2ban) para todos los puertos.
# «backend = auto» en cada vigilancia: en Debian 13 el valor por defecto es systemd, que no lee
# archivos de registro y dejaría estas vigilancias mudas.

[sitios-wp-login]
# WordPress responde 200 al fallar el inicio de sesión y 302 al acertar.
enabled  = true
port     = http,https
filter   = sitios-wp-login
backend  = auto
logpath  = /var/log/nginx/sitios-acceso.log
maxretry = 5
findtime = 600
bantime  = 3600

[sitios-escaneo]
# Rastreadores de vulnerabilidades: piden archivos que ningún visitante pide.
enabled  = true
port     = http,https
filter   = sitios-escaneo
backend  = auto
logpath  = /var/log/nginx/sitios-acceso.log
maxretry = 3
findtime = 600
bantime  = 86400

[sitios-abuso]
# Muchas respuestas 403 (cortafuegos de aplicación o archivo prohibido) o 429 (límite superado).
enabled  = true
port     = http,https
filter   = sitios-abuso
backend  = auto
logpath  = /var/log/nginx/sitios-acceso.log
maxretry = 20
findtime = 600
bantime  = 3600

[recidive]
# Quien vuelve a ser bloqueado varias veces en un día queda fuera una semana.
enabled  = true
backend  = auto
logpath  = /var/log/fail2ban.log
bantime  = 604800
findtime = 86400
maxretry = 3
