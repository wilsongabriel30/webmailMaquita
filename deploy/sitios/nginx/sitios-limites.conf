# Sitios web (maquita-sitios): zonas de límite y formato del registro común. Contexto http.
# Inicios de sesión: solo cuentan los POST (ver la página no consume el cupo).
map $request_method $sitios_post_ip {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $sitios_post_ip zone=sitios_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sitios_general:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=sitios_conn:10m;

# Registro común que vigila fail2ban: IP, sitio, petición, estado y agente.
log_format sitios '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent "$http_user_agent"';
