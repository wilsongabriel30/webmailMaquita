# Cortafuegos de aplicación para sitios con aplicaciones del catálogo (Moodle, Dolibarr, Matomo…)
# (lo instala deploy/sitios/instalar.sh en /etc/nginx/sitios-waf/).
Include /etc/nginx/sitios-waf/base.conf
Include /etc/modsecurity/crs/crs-setup.conf
Include /etc/nginx/sitios-waf/perfil-aplicacion.conf
Include /etc/modsecurity/crs/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
Include /usr/share/modsecurity-crs/rules/*.conf
Include /etc/modsecurity/crs/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
