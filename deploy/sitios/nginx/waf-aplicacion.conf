# Cortafuegos de aplicación para sitios con aplicaciones del catálogo (Moodle, Dolibarr, Matomo…)
# (lo instala deploy/sitios/instalar.sh en /etc/nginx/sitios-waf/).
Include /etc/nginx/sitios-waf/base.conf
Include /etc/modsecurity/crs/crs-setup.conf
# Estas aplicaciones guardan HTML en sus formularios (editores de cursos, notas, plantillas) y CRS no
# trae excepciones para ellas: en los envíos POST no se aplican las reglas de XSS. Siguen activas las de
# inyección SQL, inclusión de archivos, ejecución de órdenes y escáneres, y XSS en todo lo demás.
SecRule REQUEST_METHOD "@streq POST" "id:9100003,phase:1,nolog,pass,t:none,ctl:ruleRemoveByTag=attack-xss"
# Moodle (y otras) envían llamadas internas con «text/plain» (navigator.sendBeacon); se admite además
# de los tipos por defecto de CRS.
SecAction "id:9100004,phase:1,nolog,pass,t:none,setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |text/plain|'"
Include /etc/modsecurity/crs/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
Include /usr/share/modsecurity-crs/rules/*.conf
Include /etc/modsecurity/crs/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
