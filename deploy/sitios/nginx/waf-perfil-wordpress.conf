# Excepciones del perfil «wordpress» del cortafuegos de aplicación (OWASP CRS). Las incluyen /etc/nginx/sitios-waf/wordpress.conf
# y las reglas de cada sitio (/etc/maquita-sitios/waf/<dominio>.conf, generadas por waf_sitio.py), siempre
# después de crs-setup.conf y antes de las reglas de CRS.
# Excepciones oficiales de CRS para WordPress (editor, medios, ajustes).
SecAction "id:9100001,phase:1,nolog,pass,t:none,setvar:tx.crs_exclusions_wordpress=1"
