# Cortafuegos de aplicación de los sitios (ModSecurity v3 + OWASP CRS 3.3 de Debian).
# Base común: configuración recomendada de Debian, en modo BLOQUEO.
Include /etc/nginx/modsecurity.conf
SecRuleEngine On
# Subidas de hasta 64 MB (igual que client_max_body_size); formularios sin archivos, 1 MB.
SecRequestBodyLimit 67108864
SecRequestBodyNoFilesLimit 1048576
# No se inspeccionan las respuestas (rendimiento); las reglas de entrada hacen el trabajo.
SecResponseBodyAccess Off
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/sitios-waf.log
SecTmpDir /tmp
SecDataDir /tmp
