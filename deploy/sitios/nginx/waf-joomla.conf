# Cortafuegos de aplicación para sitios «joomla» (lo instala deploy/sitios/instalar.sh en /etc/nginx/sitios-waf/).
Include /etc/nginx/sitios-waf/base.conf
Include /etc/modsecurity/crs/crs-setup.conf
# CRS no trae excepciones para Joomla: en su administración (ya protegida por usuario y
# límite de intentos) no se aplican las reglas de XSS, que bloquean el editor de artículos.
SecRule REQUEST_URI "@beginsWith /administrator/" "id:9100002,phase:1,nolog,pass,t:none,ctl:ruleRemoveByTag=attack-xss"
Include /etc/modsecurity/crs/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
Include /usr/share/modsecurity-crs/rules/*.conf
Include /etc/modsecurity/crs/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
