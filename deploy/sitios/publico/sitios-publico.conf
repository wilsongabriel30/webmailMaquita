# Rutas públicas de los sitios web (v1.11), dentro del server{} HTTPS del correo (lo incluye
# «include /etc/nginx/snippets/maquita-apps/*.conf;»). Las atiende el portal de dominio (127.0.0.1:8003), que no
# comprueba nada por sí mismo: pasa cada petición al intermediario root, que comprueba la firma del gancho o la
# contraseña de la ficha del DNS dinámico. La zona sitios_publico está en conf.d/maquita-sitios-publico.conf.
#   https://<servidor>/git-despliegue/<sitio>   gancho de git (push → despliegue del sitio PHP)
#   https://<servidor>/nic/update               DNS dinámico (protocolo dyndns2)
location ^~ /git-despliegue/ {
    limit_req zone=sitios_publico burst=10 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8003/api/publico/git/;
    proxy_set_header Host panel-dominio.interno;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 90s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /nic/update {
    limit_req zone=sitios_publico burst=10 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8003/api/publico/nic/update;
    proxy_set_header Host panel-dominio.interno;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 150s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
