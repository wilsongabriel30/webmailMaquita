# Parada ordenada del webmail (igual que en maquita-webmail.service del repositorio). Instalado por
# deploy/ajustes/55-webmail-parada-ordenada.sh en los servidores anteriores a este cambio.
[Service]
Environment=UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN=3
Environment=PYTHONFAULTHANDLER=1
KillMode=mixed
TimeoutStopSec=8
