# Perfil «intermedio» de Mozilla (2026) para nginx 1.26 / OpenSSL 3.
# Solo suites AEAD con secreto hacia adelante; el cliente elige el orden.
# Lo instala deploy/webmail/instalar.sh en /etc/nginx/snippets/tls-intermedio.conf; lo incluyen los
# server{} HTTPS del correo (webmail.conf, autodiscover-dominios.conf).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
