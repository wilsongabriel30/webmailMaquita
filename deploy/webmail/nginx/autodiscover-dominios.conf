# Autodiscover y autoconfig para TODOS los dominios de correo del servidor, por HTTP (puerto 80).
#
# Outlook (clásico y nuevo), iOS y Android buscan la configuración en
# https://autodiscover.<dominio>/autodiscover/autodiscover.xml. Para que eso funcione por TLS,
# el certificado tiene que cubrir autodiscover.<dominio> de CADA dominio (emitir-certificado.sh con
# DOMINIOS_EXTRA). Mientras un dominio nuevo no esté en el certificado, el método de respaldo que
# Outlook prueba a continuación es una redirección por HTTP simple en el puerto 80, sin TLS:
# aquí se responde 302 al host canónico, que sí tiene certificado. Así un dominio recién apuntado
# a este servidor (día del corte) autoconfigura Outlook antes de reemitir el certificado.
#
# No sirve nada más: cualquier otra ruta va al canónico por HTTPS. Los retos ACME quedan
# disponibles para poder emitir el certificado de esos nombres.
server {
    listen 80;
    listen [::]:80;
    # Comodín de sufijo: cualquier dominio. Los nombres exactos del vhost principal ganan siempre.
    server_name autodiscover.* autoconfig.*;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Outlook, iOS, Android
    location ~* ^/autodiscover/autodiscover\.(xml|json) {
        return 302 https://mail.tudominio.com$request_uri;
    }

    # Thunderbird / Evolution
    location ~* ^/mail/config-v1\.1\.xml {
        return 302 https://autoconfig.tudominio.com$request_uri;
    }

    location / {
        return 301 https://mail.tudominio.com/;
    }
}
