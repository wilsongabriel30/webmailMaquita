# Autodiscover y autoconfig para TODOS los dominios de correo del servidor, por HTTP (puerto 80).
#
# Outlook (clásico y nuevo), iOS y Android buscan la configuración en
# https://autodiscover.<dominio>/autodiscover/autodiscover.xml. Para que eso funcione por TLS,
# el certificado tiene que cubrir autodiscover.<dominio> de CADA dominio (emitir-certificado.sh con
# DOMINIOS_EXTRA). Mientras un dominio nuevo no esté en el certificado, el método de respaldo que
# Outlook prueba a continuación es una redirección por HTTP simple en el puerto 80, sin TLS:
# aquí se responde 302 al host canónico, que sí tiene certificado. Así un dominio recién apuntado
# a este servidor (día del corte) autoconfigura Outlook antes de reemitir el certificado.
#
# No sirve nada más: cualquier otra ruta va al canónico por HTTPS. Los retos ACME quedan
# disponibles para poder emitir el certificado de esos nombres.
server {
    listen 80;
    listen [::]:80;
    # Comodín de sufijo: cualquier dominio. Los nombres exactos del vhost principal ganan siempre.
    server_name autodiscover.* autoconfig.*;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Outlook, iOS, Android
    location ~* ^/autodiscover/autodiscover\.(xml|json) {
        return 302 https://mail.tudominio.com$request_uri;
    }

    # Thunderbird / Evolution
    location ~* ^/mail/config-v1\.1\.xml {
        return 302 https://autoconfig.tudominio.com$request_uri;
    }

    location / {
        return 301 https://mail.tudominio.com/;
    }
}

# Los mismos nombres por HTTPS, con el certificado del correo (emitir-certificado.sh con
# DOMINIOS_EXTRA los incluye). Si el certificado aún no cubre un dominio, el cliente cae en la
# redirección por HTTP de arriba; en cuanto lo cubre, esta es la ruta normal.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name autodiscover.* autoconfig.*;

    ssl_certificate /etc/letsencrypt/live/mail.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.tudominio.com/privkey.pem;
    include snippets/tls-intermedio.conf;

    # Estas respuestas llevan la dirección de correo de quien configura su cliente: que el
    # navegador (o el cliente) no vuelva a intentarlo por HTTP. Sin CSP a propósito: aquí se
    # sirven XML y JSON de autoconfiguración, no páginas.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Outlook, iOS, Android: lo sirve el backend (IMAP/SMTP y ActiveSync para cualquier dominio)
    location ~* ^/[Aa]utodiscover/[Aa]utodiscover\.(xml|json) {
        proxy_pass http://webmail_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Thunderbird / Evolution: el XML del dominio canónico vale para todos (mismo servidor)
    location ~* ^/mail/config-v1\.1\.xml {
        return 302 https://autoconfig.tudominio.com$request_uri;
    }

    location / {
        return 301 https://mail.tudominio.com/;
    }
}
