# Instaladores de las apps propias de la organización (APK de Android y su manifiesto de actualización).
# Se publican en /opt/maquita-webmail/descargas-app/ (fuera de www/webmail: el despliegue del frontend
# reemplaza esa carpeta entera). Solo se sirven .apk y .json con nombre simple: ni copias .bak ni carpetas.
# Un archivo ausente da 404 (nunca el index.html del webmail): el webmail entonces no ofrece la app.
location ^~ /webmail/descargas/ {
    location ~ "^/webmail/descargas/([a-z0-9][a-z0-9._-]{0,80}\.(apk|json))$" {
        alias /opt/maquita-webmail/descargas-app/$1;
        types { application/vnd.android.package-archive apk; application/json json; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    return 404;
}
