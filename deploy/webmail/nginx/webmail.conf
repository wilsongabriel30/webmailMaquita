# =====================================================
# Nginx — Fundación Maquita Webmail
# =====================================================
# Copiar a /etc/nginx/sites-available/mail.tudominio.com
# Editar: cambiar "tudominio.com" por tu dominio real
# Enlazar: ln -sf /etc/nginx/sites-available/mail.tudominio.com /etc/nginx/sites-enabled/
# Verificar: nginx -t && systemctl reload nginx
# =====================================================

# Rate limiting
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=compose:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name mail.tudominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS principal
server {
    listen 443 ssl http2;
    server_name mail.tudominio.com;

    # === SSL ===
    # Opción A: Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/mail.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.tudominio.com/privkey.pem;
    # Opción B: Wildcard (descomentar y comentar A)
    # ssl_certificate /etc/ssl/wildcard-tudominio/fullchain.pem;
    # ssl_certificate_key /etc/ssl/wildcard-tudominio/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;

    # === Seguridad ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Bloquear path traversal
    if ($request_uri ~* "\.\.") {
        return 403;
    }

    # Bloquear robots (app privada)
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # === Webmail SPA (React) ===
    location = /webmail {
        return 301 /webmail/;
    }

    location /webmail/ {
        root /opt/maquita-webmail/www;

        # Service Worker: sin cache para actualizaciones inmediatas
        location = /webmail/sw.js {
            root /opt/maquita-webmail/www;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Service-Worker-Allowed "/webmail/";
        }

        # Assets con hash: cache inmutable 1 año
        location ~* /webmail/assets/ {
            root /opt/maquita-webmail/www;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html: sin cache
        location ~* /webmail/index.html$ {
            root /opt/maquita-webmail/www;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # SPA fallback
        location = /webmail/ {
            root /opt/maquita-webmail/www;
            try_files /webmail/index.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        try_files $uri $uri/ /webmail/index.html;
    }

    # === API Backend (FastAPI) ===

    # Autodiscover Outlook (dinamico, multi-dominio) -> backend (LoginName = correo completo)
    location ~* ^/[Aa]utodiscover/[Aa]utodiscover\.xml$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Limite de tamano de adjuntos (fuente unica MAX_ATTACHMENT_MB)
    include snippets/maquita-max-body.conf;

    # Login: rate limit estricto
    location = /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compose: rate limit moderado
    location = /api/mail/compose {
        limit_req zone=compose burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API general
    location /api/ {
        limit_req zone=api burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # client_max_body_size lo fija snippets/maquita-max-body.conf (server-level)
        proxy_read_timeout 120s;
    }

    # === WebSocket (notificaciones tiempo real) ===
    location /api/ws {
        proxy_pass http://127.0.0.1:8000/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # WebSocket de presencia (quién está en línea)
    location /api/presence/ws {
        proxy_pass http://127.0.0.1:8000/api/presence/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # === CalDAV / CardDAV (Radicale) ===
    location /.well-known/caldav { return 301 /dav/; }
    location /.well-known/carddav { return 301 /dav/; }

    location /dav/ {
        proxy_pass http://127.0.0.1:5232/;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    # ============================================================================
    # OnlyOffice — vista previa de Word/Excel/PowerPoint (OPCIONAL)
    # ----------------------------------------------------------------------------
    # Para previsualizar documentos Office hace falta un OnlyOffice Document Server.
    # Cambia "127.0.0.1:8080" por la IP:puerto de TU Document Server en las 4 rutas.
    # (La URL y el secreto JWT tambien se configuran en el panel :8443 -> OnlyOffice/Nube.)
    # El editor construye URLs absolutas a /cache/files/, /doc/{id}/c/ y /coauthoring/
    # en la raiz del dominio: por eso las 4 rutas son obligatorias para que NO salga
    # en blanco. proxy_http_version 1.1 es imprescindible para el WebSocket.
    # Sin OnlyOffice, la vista previa de Office no funciona (todo lo demas si).
    # ============================================================================
    location /onlyoffice/ {
        if ($request_uri ~* "\.\." ) { return 403; }
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
        add_header Service-Worker-Allowed /onlyoffice/;
    }
    location /cache/files/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_buffering off;
    }
    location ~ ^/doc/[^/]+/c/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
    location /coauthoring/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # WhisperLive — dictado por voz en streaming (OPCIONAL). Cambia la IP:puerto
    # por tu servidor WhisperLive (GPU). El servicio escucha WebSocket en :9090.
    location /whisperlive/ {
        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade \$http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host \$host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # === ActiveSync (Z-Push) ===
    # Descomentar si instalaste Z-Push (ver deploy/z-push/)
    # Cambiar php8.4 por tu versión de PHP
    #
    # location /Microsoft-Server-ActiveSync {
    #     fastcgi_pass unix:/run/php/php8.4-zpush.sock;
    #     fastcgi_index index.php;
    #     fastcgi_param SCRIPT_FILENAME /opt/z-push/src/index.php;
    #     include fastcgi_params;
    #     fastcgi_read_timeout 3600;
    #     fastcgi_send_timeout 3600;
    #     fastcgi_buffering off;
    #     client_max_body_size 50m;
    # }
    #
    # location ~* /[Aa]utodiscover/[Aa]utodiscover.xml {
    #     fastcgi_pass unix:/run/php/php8.4-zpush.sock;
    #     fastcgi_index index.php;
    #     fastcgi_param SCRIPT_FILENAME /opt/z-push/src/autodiscover/autodiscover.php;
    #     include fastcgi_params;
    # }

    # Raíz -> Webmail
    location / {
        return 301 /webmail;
    }
}
