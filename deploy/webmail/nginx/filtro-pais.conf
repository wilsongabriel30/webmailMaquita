# Filtro por país del puerto 443, en nginx (12/11/2026). Va en /etc/nginx/conf.d/ (contexto http).
#
# Antes lo hacía el cortafuegos, en bloque: no distinguía «abrir el webmail» de «un servidor que pide
# recuperar un correo» ni de «alguien que abre un enlace seguro». nginx sí ve la ruta.
#
# $origen_permitido  1 si quien llama está en la lista (países habilitados + redes propias + nube de
#                    Microsoft). La genera deploy/tools/geo-nginx-rebuild.sh desde el cortafuegos; en
#                    una instalación sin filtro por país la lista deja pasar a todos.
# $ruta_abierta      1 en las rutas que deben abrir desde cualquier país:
#                      /api/federacion/  recuperación y reacciones entre servidores
#                      /api/safelink     enlace seguro (lo abre quien recibe un correo de la casa)
#                      /.well-known/     descubrimiento estándar
# $fuera_de_pais     1 = se corta la conexión sin responder (444), como hacía el cortafuegos.
geo $origen_permitido {
    default 0;
    include /etc/nginx/geo/paises_permitidos.conf;
}
map $uri $ruta_abierta {
    default              0;
    ~^/api/federacion/   1;
    /api/safelink        1;
    ~^/\.well-known/     1;
}
map "$origen_permitido$ruta_abierta" $fuera_de_pais {
    default 0;
    "00"    1;
}
