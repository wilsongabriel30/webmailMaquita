# Marca de la app de escritorio. Va en /etc/nginx/conf.d/ (contexto http).
#
# La app de escritorio se identifica con «MaquitaTeams» en la cabecera User-Agent, pero la quita del
# navigator.userAgent que ve la página. Para que el webmail sepa que lo abrió la app (y no pinte la
# burbuja del mini-chat, porque la app ya tiene su botón Chat), nginx añade una etiqueta <meta> a
# index.html solo en ese caso. En un navegador normal la variable queda vacía y nada cambia.
#
# En los dos bloques que sirven index.html del webmail (location = /webmail/index.html y
# location = /webmail/), junto al sub_filter del nonce:
#
#     sub_filter '<head>' '<head>$marca_cliente_teams';
#
# La lee frontend/src/lib/clienteEscritorio.ts.
map $http_user_agent $marca_cliente_teams {
    default          "";
    "~*MaquitaTeams" '<meta name="maquita-cliente" content="teams">';
}
