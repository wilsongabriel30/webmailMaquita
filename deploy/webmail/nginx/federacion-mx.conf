# =====================================================
# Federación entre servidores cuando el MX NO se llama igual que el correo web
# =====================================================
# Los servidores de la suite se encuentran por el registro MX del dominio y se hablan por HTTPS en
# https://<MX>/api/federacion/v1/… (recuperar un correo enviado por error, reacciones). El cliente NO
# sigue redirecciones, a propósito: un servidor ajeno no debe poder desviar el pedido a otra dirección.
#
# Caso normal: el MX es el mismo nombre del correo web y no hace falta nada de esto.
# Este archivo es para cuando el MX tiene otro nombre (p. ej. correo web en webmail.ejemplo.org y
# MX en mail.ejemplo.org y mail2.ejemplo.org): sin él, el MX redirige o no tiene certificado y los
# pedidos de los demás servidores no llegan nunca (informe de Andes, 16/11/2026).
#
# Lo instala deploy/tools/federacion-mx-nginx.sh, que sustituye __NOMBRES_MX__ y __CERTIFICADO__.
# Aquí solo se atiende /api/federacion/: el correo web sigue en su propio nombre.

server {
    listen 80;
    listen [::]:80;
    server_name __NOMBRES_MX__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Sin filtro por país: la federación se atiende desde cualquier servidor de la suite.
    server_name __NOMBRES_MX__;

    ssl_certificate /etc/letsencrypt/live/__CERTIFICADO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERTIFICADO__/privkey.pem;
    include snippets/tls-intermedio.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/federacion/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://webmail_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
