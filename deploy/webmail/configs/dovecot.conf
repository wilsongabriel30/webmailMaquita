# =============================================================================
# Dovecot 2.4 — configuración Maquita Webmail (instalación nativa)
# Generada por deploy/webmail/instalar.sh. __DB_PASS__ se reemplaza al instalar.
# Buzones virtuales en PostgreSQL (tabla mailbox) + usuario maestro para el backend.
# =============================================================================
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap lmtp sieve pop3

# ---- Autenticación ----------------------------------------------------------
auth_mechanisms = plain login
auth_master_user_separator = *
first_valid_uid = 5000
last_valid_uid = 5000

# ---- Almacenamiento del correo ----------------------------------------------
mail_driver = maildir
mail_path = /var/vmail/%{user|domain}/%{user|username}/Maildir
mail_home = /var/vmail/%{user|domain}/%{user|username}
mail_uid = 5000
mail_gid = 5000
mail_privileged_group = mail

# ---- Conexión a PostgreSQL --------------------------------------------------
sql_driver = pgsql
pgsql localhost {
  parameters {
    host = localhost
    dbname = maildb
    user = mailserver
    password = __DB_PASS__
  }
}

# Contraseña principal (hash en la tabla mailbox). D-5: cuando la política
# contrasenas_aplicacion_obligatorias está en 'true', solo vale desde el propio servidor
# (webmail y app, 127.0.0.1/::1); los clientes externos usan contraseñas de aplicación.
passdb sql {
  default_password_scheme = SHA512-CRYPT
  query = SELECT username AS user, password FROM mailbox WHERE username = '%{user}' AND active = true \
    AND ('%{remote_ip}' IN ('127.0.0.1', '::1') \
         OR NOT EXISTS (SELECT 1 FROM auth_politica WHERE clave = 'contrasenas_aplicacion_obligatorias' AND valor = 'true'))
}

# Contraseñas de aplicación (D-5): una por cliente, revocables; se verifican con bcrypt en SQL
# (migrations/2026-09-07-contrasenas-aplicacion.sql) y Dovecot reverifica el hash devuelto.
passdb contrasenas_aplicacion {
  driver = sql
  query = SELECT * FROM verificar_contrasena_aplicacion('%{user}', '%{password}', '%{remote_ip}')
}

# Usuario maestro: permite al backend abrir cualquier buzón (MASTER_PASSWORD)
passdb master_passdb {
  driver = passwd-file
  master = yes
  result_success = continue
  passwd_file_path = /etc/dovecot/master-users
}

userdb sql {
  iterate_query = SELECT username AS user FROM mailbox WHERE active = true
  query = SELECT '/var/vmail/%{user|domain}/%{user|username}' AS home, 5000 AS uid, 5000 AS gid FROM mailbox WHERE username = '%{user}' AND active = true
}

# ---- TLS (arranca con el certificado snakeoil; reemplazar con certbot) -------
ssl = yes
ssl_server_cert_file = /etc/dovecot/private/dovecot.pem
ssl_server_key_file = /etc/dovecot/private/dovecot.key

# ---- Carpetas estándar ------------------------------------------------------
namespace inbox {
  inbox = yes
  separator = .
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

# ---- Sockets para Postfix (SASL auth + entrega LMTP) ------------------------
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

# ---- ManageSieve (reglas del lado del servidor) -----------------------------
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

protocol lmtp {
  mail_plugins = sieve
}
