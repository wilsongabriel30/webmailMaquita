# Escaneo antivirus de adjuntos con ClamAV (clamd), vía rspamd.
# Marca el correo con CLAM_VIRUS (no lo rechaza). Cambia action a "reject" si
# prefieres rechazar el correo infectado en vez de solo marcarlo.
clamav {
  action = "add_header";
  type = "clamav";
  servers = "/var/run/clamav/clamd.ctl";
  scan_mime_parts = true;
  symbol = "CLAM_VIRUS";
  patterns {
    JUST_EICAR = "^Eicar-Test-Signature$";
  }
}
