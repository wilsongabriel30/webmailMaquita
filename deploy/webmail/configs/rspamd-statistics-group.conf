# /etc/rspamd/local.d/statistics_group.conf — peso del clasificador bayesiano (08/10/2026).
# Por defecto BAYES_SPAM pesa 5,1 y el umbral de «no deseado» (add_header) es 6: el Bayes solo, con un
# clasificador sesgado, manda a no deseado correo legítimo (reservas de clientes, avisos de aliados).
# Con 4,0 el Bayes necesita al menos otra señal para marcar.
symbols {
    "BAYES_SPAM" { weight = 4.0; description = "Bayes: spam (peso reducido para no decidir solo)"; }
}
