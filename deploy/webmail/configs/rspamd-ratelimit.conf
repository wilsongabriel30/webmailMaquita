rates {
  to {
    symbol = "RATELIMIT_TO";
    bucket {
      burst = 100;
      rate = "10 / 1min";
    }
  }
  to_ip {
    symbol = "RATELIMIT_TO_IP";
    bucket {
      burst = 50;
      rate = "5 / 1min";
    }
  }
  to_ip_from {
    symbol = "RATELIMIT_TO_IP_FROM";
    bucket {
      burst = 20;
      rate = "2 / 1min";
    }
  }
  bounce_to {
    symbol = "RATELIMIT_BOUNCE_TO";
    bucket {
      burst = 10;
      rate = "1 / 1min";
    }
  }
  # 2026-06-16 (Wilson) — BLINDAJE anti-cuenta-comprometida (leccion Zimbra).
  # Limita SOLO correo saliente AUTENTICADO: el selector 'user' es vacio en inbound,
  # por lo que NO afecta correo entrante. Al exceder -> soft reject (DEFER): el usuario
  # legitimo reintenta y entrega; una cuenta robada queda frenada. Ajustable desde panel.
  per_user_out {
    selector = 'user';
    bucket {
      burst = 200;
      rate = "3 / 1min";
    }
  }
}

# Cuentas exentas del limite (bulk legitimo) — se llena desde el panel
whitelisted_rcpts = "postmaster,mailer-daemon";
