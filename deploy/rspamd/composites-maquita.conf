# deploy/rspamd/composites-maquita.conf → se añade a /etc/rspamd/local.d/composites.conf
# Remitente autenticado de verdad: DMARC alineado y firma DKIM válida del dominio. No suma ni resta
# puntos; solo sirve para que la lista gris no retrase códigos de verificación (greylist-autenticados.conf).
MAQ_REMITENTE_AUTENTICADO {
  expression = "DMARC_POLICY_ALLOW & R_DKIM_ALLOW";
  score = 0.0;
  description = "DMARC alineado y DKIM válido: no se aplica lista gris";
}
