rules {
  MAQ_OWN_DOMAIN_SPOOF_REJECT {
    action = "reject";
    expression = "MAQ_OWN_DOMAIN_SPOOF";
    message = "Rechazado: suplantacion de su propio dominio (spoofing).";
  }
  MAQ_BANNED_SENDER_DOM_REJECT {
    action = "reject";
    expression = "MAQ_BANNED_SENDER_DOM";
    message = "Rechazado: dominio remitente bloqueado por Maquita (malware/phishing).";
  }
  MAQ_BANNED_SENDER_ADDR_REJECT {
    action = "reject";
    expression = "MAQ_BANNED_SENDER_ADDR";
    message = "Rechazado: remitente bloqueado por Maquita (malware/phishing).";
  }
  MAQ_BANNED_EXTENSION_REJECT {
    action = "reject";
    expression = "MAQ_BANNED_EXTENSION";
    message = "Rechazado: adjunto con extension prohibida (posible malware).";
  }
}
