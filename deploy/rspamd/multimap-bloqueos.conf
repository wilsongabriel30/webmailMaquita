# Fragmento para ANEXAR a /etc/rspamd/local.d/multimap.conf
# Simbolos del panel Bloqueos Correo (rechazo duro via force_actions.conf).
# Los mapas van en /etc/rspamd/local.d/maps/ con dueño www-data:_rspamd 664
# (el backend del webmail los edita; requiere ReadWritePaths en el systemd, ver hardening.conf).

# --- BLOQUEO DURO: dominios remitentes prohibidos (malware/phishing) ---
# Administrable desde el panel admin del webmail (Bloqueos)
# El rechazo lo hace force_actions.conf (MAQ_BANNED_*_REJECT)
MAQ_BANNED_SENDER_DOM {
  type = "from";
  map = "/etc/rspamd/local.d/maps/banned_sender_domains.map";
  filter = "email:domain";
  score = 15.0;
  description = "Dominio remitente prohibido (malware/phishing) - Maquita";
}

# --- BLOQUEO DURO: direcciones remitentes prohibidas ---
MAQ_BANNED_SENDER_ADDR {
  type = "from";
  map = "/etc/rspamd/local.d/maps/banned_senders.map";
  score = 15.0;
  description = "Remitente prohibido (malware/phishing) - Maquita";
}

# --- BLOQUEO DURO: extensiones de adjunto prohibidas ---
MAQ_BANNED_EXTENSION {
  type = "filename";
  map = "/etc/rspamd/local.d/maps/banned_extensions.map";
  regexp = true;
  score = 15.0;
  description = "Adjunto con extension prohibida (ejecutables/archivos partidos) - Maquita";
}
