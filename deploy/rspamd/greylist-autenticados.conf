# deploy/rspamd/greylist-autenticados.conf → se fusiona en /etc/rspamd/local.d/greylist.conf
# Regla general (08/10/2026): todo correo con DMARC alineado y DKIM válido entra sin pasar por la lista gris.
# Los códigos de verificación, recuperación de contraseñas y registros llegan al instante; la lista gris
# sigue frenando lo no autenticado (redes de bots). Necesita el compuesto MAQ_REMITENTE_AUTENTICADO
# (deploy/rspamd/composites-maquita.conf).
whitelist_symbols = ["MAQ_REMITENTE_AUTENTICADO"];
