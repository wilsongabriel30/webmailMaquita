# Z-Push (ActiveSync) en contenedor: FastCGI hacia 127.0.0.1:9000 (php-fpm del contenedor).
# SCRIPT_FILENAME es la ruta DENTRO del contenedor. Incluir dentro del server{} HTTPS del correo:
#   include snippets/maquita-apps/activesync.conf;
# El autodiscover (XML y JSON, Outlook clásico y nuevo) lo sirve el backend, no Z-Push.
# ^~ es obligatorio: sin él, la location regex del webmail gana y responde 301 a /webmail.
location ^~ /Microsoft-Server-ActiveSync {
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME /opt/z-push/src/index.php;
    include fastcgi_params;
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_X_REAL_IP $remote_addr;

    # Ping/Sync de ActiveSync mantienen la conexión abierta mucho tiempo
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_connect_timeout 60;
    fastcgi_buffering off;

    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/activesync-access.log;
    error_log /var/log/nginx/activesync-error.log;
}
