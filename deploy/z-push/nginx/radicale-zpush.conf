# Radicale para Z-Push (N-19): el contenedor NO habla con Radicale directamente.
#
# Radicale escucha solo en 127.0.0.1:5232 con `auth type = http_x_remote_user` (confía en la
# cabecera). Este vhost escucha en la IP del puente de Docker (donde el contenedor resuelve
# host.docker.internal), comprueba las credenciales Basic del dispositivo contra el backend
# (`auth_request` → /api/auth/dav: contraseña de aplicación, o la principal mientras no sea
# obligatoria) y, si valen, pone X-Remote-User con el correo y reenvía a Radicale. Sin esto,
# cualquier proceso del puente leería el calendario de cualquiera.
#
# Instalado por deploy/z-push/instalar.sh. La IP del puente: `ip -4 addr show docker0`.
server {
    listen 172.17.0.1:5232;
    server_name host.docker.internal _;

    client_max_body_size 50m;

    location = /_auth_dav {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth/dav;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        auth_request /_auth_dav;
        auth_request_set $usuario_dav $upstream_http_x_usuario;
        error_page 401 = @sin_credenciales;

        proxy_pass http://127.0.0.1:5232;
        proxy_set_header X-Remote-User $usuario_dav;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 120s;
    }

    location @sin_credenciales {
        add_header WWW-Authenticate 'Basic realm="Maquita DAV"' always;
        return 401;
    }
}
