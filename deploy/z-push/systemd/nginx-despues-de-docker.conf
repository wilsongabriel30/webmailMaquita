# nginx escucha en la IP del puente de Docker (vhost radicale-zpush, para ActiveSync). Si al arrancar el
# servidor nginx sube antes que Docker, esa IP todavía no existe: «bind() ... failed (99: Cannot assign
# requested address)» y queda caído todo lo web (informe de Andes, 15/11/2026).
# Va en /etc/systemd/system/nginx.service.d/; lo instalan deploy/z-push/instalar.sh y el ajuste 83.
[Unit]
After=docker.service
Wants=docker.service

[Service]
Restart=on-failure
RestartSec=5
