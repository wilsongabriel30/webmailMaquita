[zpush]
user = www-data
group = www-data
listen = /run/php/php8.4-zpush.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Security
php_admin_value[open_basedir] = /opt/z-push/:/var/lib/z-push/:/var/log/z-push/:/tmp/:/usr/bin/:/etc/mime.types:/usr/share/awl/inc/:/usr/share/php/
php_admin_value[disable_functions] = passthru,system,popen,proc_open
php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /var/log/z-push/php-error.log
php_admin_value[session.cookie_httponly] = On
php_admin_value[session.cookie_secure] = On
php_value[max_execution_time] = 3600
php_value[memory_limit] = 256M
php_value[post_max_size] = 50M
php_value[upload_max_filesize] = 50M

; Environment
env[TZ] = America/Guayaquil
