# =============================================================================
# Dovecot 2.4 — cuotas de buzón y aprendizaje del antispam al mover correos.
# Se instala en /etc/dovecot/maquita.d/cuotas-y-antispam.conf; dovecot.conf lo carga con
# «!include_try /etc/dovecot/maquita.d/*.conf» (deploy/dovecot/instalar-cuotas-antispam.sh, que usan
# deploy/webmail/instalar.sh en instalaciones nuevas y deploy/ajustes/51-* en las existentes).
# =============================================================================

# ---- Cuotas -------------------------------------------------------------------
# La cuota de cada buzón viene de la tabla mailbox (columna quota, en bytes; 0 = sin límite): el
# userdb la devuelve como quota_storage_size. OJO Dovecot 2.4 (probado 20/10/2026):
#  - el campo «quota_rule» de la 2.3 se ignora en silencio;
#  - un storage_size escrito DENTRO del bloque quota tapa el valor de cada usuario, por eso el valor
#    por defecto va aquí, fuera del bloque.
mail_plugins {
  quota = yes
}
quota_storage_size = unlimited
quota "User quota" {
  driver = count
}
# La entrega (LMTP) también respeta la cuota: protocol lmtp tiene su propia lista de plugins.
protocol lmtp {
  mail_plugins {
    quota = yes
  }
}
protocol imap {
  mail_plugins {
    imap_quota = yes
    imap_sieve = yes
  }
}

# ---- Aprendizaje del antispam (IMAPSieve + rspamc) ------------------------------
#  - Mover un correo A «Junk»   → Rspamd lo aprende como spam.
#  - Sacar un correo DE «Junk»  → lo aprende como legítimo (salvo si va a la papelera).
# Los programas que llaman a rspamc viven en /var/vmail/sieve/pipe-bin (deploy/dovecot/pipe-bin).
sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}
sieve_global_extensions {
  vnd.dovecot.pipe = yes
}
sieve_pipe_bin_dir = /var/vmail/sieve/pipe-bin

namespace inbox {
  mailbox Junk {
    sieve_script learn-spam {
      type = before
      cause = copy append
      driver = file
      path = /var/vmail/sieve/report-spam.sieve
    }
  }
}
imapsieve_from Junk {
  sieve_script learn-ham {
    type = before
    cause = copy
    driver = file
    path = /var/vmail/sieve/report-ham.sieve
  }
}
