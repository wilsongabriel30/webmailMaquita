# =============================================================================
# Búsqueda de texto completo del correo (Dovecot 2.4 + fts-flatcurve)
# Instalado por deploy/dovecot/busqueda/instalar.sh en /etc/dovecot/maquita.d/.
#
# Por qué: sin índice, buscar por remitente o asunto en un buzón grande recorre todos los
# mensajes (en uno de 120.000 correos tardaba hasta 39 s, más que la espera del webmail).
# Con el índice responde en décimas de segundo por carpeta y también busca dentro del texto.
# Motor: flatcurve (el nativo de Dovecot 2.4, paquete dovecot-flatcurve de Debian). Se eligió
# frente a fts-xapian tras medir los dos con el mismo buzón: 0,05–0,3 s frente a 1–18 s por
# carpeta, e índice de menos de la mitad de tamaño. Es el motor que usan todas las cuentas del
# servidor de referencia desde octubre de 2026.
# =============================================================================
mail_plugins {
  fts = yes
  fts_flatcurve = yes
}
# El bloque (aunque vacío) es el que activa el motor: sin él, Dovecot 2.4 carga los módulos pero no
# usa el índice («fts not enabled for user's namespace»), y cada búsqueda recorre los mensajes.
fts flatcurve {
}

# Los correos nuevos se indexan al llegar; lo antiguo, de noche (busqueda-indexar-noche).
fts_autoindex = yes
# Las búsquedas por cabecera usan lo ya indexado sin esperar; solo las del texto indexan antes
# lo que falte.
fts_search_add_missing = body-search-only

# Tildes y mayúsculas indiferentes («Reunión» = «reunion»); las direcciones de correo se
# indexan enteras y por partes.
language_filters = normalizer-icu
language_tokenizers = generic email-address
language_tokenizer_generic_algorithm = simple
language es {
  default = yes
}
language en {
}

service indexer-worker {
  vsz_limit = 2G
  # Como mucho dos indexadores a la vez: con más, el disco se satura y todo el correo se vuelve lento.
  process_limit = 2
}
