# =============================================================================
# Búsqueda de texto completo: texto de los adjuntos y carpetas que no se indexan al llegar
# (Dovecot 2.4). Instalado por deploy/dovecot/fts/instalar.sh en /etc/dovecot/maquita.d/.
# Completa 60-busqueda.conf (motor fts-flatcurve, idiomas español e inglés, índice al llegar).
#
# Sintaxis 2.4: «fts_decoder = …» de la 2.3 pasó a fts_decoder_driver + fts_decoder_script_socket_path,
# y «fts_autoindex_exclude» a «fts_autoindex = no» dentro de cada carpeta.
# =============================================================================

# ---- Texto de los adjuntos ------------------------------------------------------
# PDF, Word/Excel/PowerPoint (también 97-2003), LibreOffice, RTF, HTML, comprimidos (ZIP, TAR, gzip,
# bzip2, xz, 7z, con tope de tamaño y de profundidad) y metadatos EXIF de las fotos. El decodificador
# corre como «maquita-fts», un usuario sin acceso a los buzones: recibe el adjunto por la entrada
# estándar y devuelve el texto. Límites en /etc/maquita-fts/decodificador.conf.
fts_decoder_driver = script
fts_decoder_script_socket_path = maquita-decode2text

service maquita-decode2text {
  executable = script /usr/local/lib/maquita-fts/decode2text.sh
  user = maquita-fts
  # Solo los procesos del correo (vmail) hablan con el decodificador.
  unix_listener maquita-decode2text {
    mode = 0600
    user = vmail
  }
  # Pocos a la vez: el texto de los adjuntos no debe quitarle disco ni CPU al correo.
  process_limit = 4
  vsz_limit = 1536M
}

# ---- Carpetas que no se indexan al llegar ----------------------------------------
# La papelera y el correo no deseado no se indexan en cada entrega (ahorra disco y CPU con el spam).
# Siguen siendo buscables: al buscar dentro del texto, Dovecot indexa antes lo que falte
# (fts_search_add_missing), así que el eDiscovery y la persona que busca en su papelera encuentran
# igual lo que hay. El índice nunca toca los mensajes: borrar o rehacer el índice no borra correo,
# tampoco el que está bajo retención legal.
namespace inbox {
  mailbox Trash {
    fts_autoindex = no
  }
  mailbox Junk {
    fts_autoindex = no
  }
}
