# Límites del decodificador de adjuntos del índice de texto completo (/etc/maquita-fts/decodificador.conf).
# CLAVE=número, una por línea. Lo que no se entienda se ignora; ningún valor pasa de su tope duro.
# El instalador lo crea una vez y no lo vuelve a tocar: los cambios locales se conservan.

# Adjunto más grande cuyo texto se indexa (MB; tope 200).
MAX_ENTRADA_MB=50
# Bytes reales descomprimidos por adjunto, sumando todos los niveles (MB; tope 1024).
MAX_DESCOMPRIMIDO_MB=100
# Archivos dentro de comprimidos, en total (tope 20000).
MAX_MIEMBROS=2000
# Comprimido dentro de comprimido (tope 5).
MAX_PROFUNDIDAD=3
# Proporción máxima descomprimido/comprimido de un miembro de más de 1 MB (tope 1000).
MAX_RATIO=500
# Texto que se guarda en el índice por adjunto (MB; tope 32).
MAX_TEXTO_MB=4
# Segundos por programa externo (pdftotext, 7z, exiftool…; tope 120) y por adjunto completo (tope 300).
TIEMPO_EXTERNO_S=20
TIEMPO_TOTAL_S=60
# Memoria virtual del decodificador y sus programas (MB; tope 4096).
MEMORIA_MB=1024

# OCR con Tesseract de PDF escaneados y fotos: 0 = no (por defecto), 1 = sí. Cuesta CPU; activarlo
# con «deploy/dovecot/fts/instalar.sh --con-ocr», que instala tesseract-ocr con español e inglés.
OCR=0
# Páginas de cada PDF escaneado que pasan por OCR (tope 20).
OCR_PAGINAS=3
