<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chat{% endblock %}</title>
  <link rel="icon" href="/static/favicon.ico">
  <!-- Misma base de diseño y librerías que la plantilla de Raíces (sin navbar), para que el chat
       se vea y funcione IGUAL en Raíces, en la burbuja del correo y en la app de escritorio.
       Todo se sirve por /static (los nginx públicos lo entregan desde el sistema central). -->
  <link href="/static/vendor/cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/vendor/font-awesome/css/all.min.css" rel="stylesheet">
  <link href="/static/vendor/cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/fix-dark-mode.css">
  <link rel="stylesheet" href="/static/css/admin-design-system.css">
  <link href="/static/vendor/fonts/inter.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/font/bootstrap-icons.min.css">
  {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
  <div class="main-content flex-grow-1">
    {% block content %}{% endblock %}
  </div>
  <script src="/static/vendor/cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/static/vendor/cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script src="/static/vendor/cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js"></script>
  <script src="/static/vendor/cdn.jsdelivr.net/npm/sweetalert2@11.js"></script>
  <script>
  // Respaldo: si toastr no cargó, los avisos van a consola en vez de romper el chat.
  if (typeof window.toastr === 'undefined') {
    window.toastr = { info: console.info, success: console.log, warning: console.warn, error: console.error, options: {} };
  } else {
    toastr.options = Object.assign(toastr.options || {}, { positionClass: 'toast-top-right', timeOut: 3000, progressBar: true });
  }
  </script>
  {% block extra_js %}{% endblock %}
  <!-- Aviso al correo (padre) cuando llega un mensaje, para el brillo INSTANTANEO
       del icono. Reutiliza el mismo socket del chat (socket.io multiplexa io()). -->
  <script>
  (function(){
    if (window.parent === window) return; // solo dentro del iframe del correo
    function avisar(){ try { window.parent.postMessage({source:"maquita-chat", type:"nuevo-mensaje"}, "*"); } catch(e){} }
    var intentos = 0;
    (function hook(){
      intentos++;
      if (typeof io !== "undefined") {
        try { var s = io(); s.on("msg", avisar); s.on("new_message", avisar); return; } catch(e){}
      }
      if (intentos < 40) setTimeout(hook, 500);
    })();
  })();
  </script>
</body>
</html>
