<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chat{% endblock %}</title>
  <!-- Assets compartidos (se sirven vía /static; en el piloto los entrega el
       servidor central por HTTP, solo lectura). Base mínima e independiente:
       no arrastra el chrome del sistema de origen. -->
  <link rel="stylesheet" href="/static/vendor/cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/vendor/font-awesome/css/all.min.css">
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/font/bootstrap-icons.min.css">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="main-content">
    {% block content %}{% endblock %}
  </div>
  <script src="/static/vendor/cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
  <!-- Aviso al correo (padre) cuando llega un mensaje, para el brillo INSTANTANEO
       del icono. Reutiliza el mismo socket del chat (socket.io multiplexa io()). -->
  <script>
  (function(){
    if (window.parent === window) return; // solo dentro del iframe del correo
    function avisar(){ try { window.parent.postMessage({source:"maquita-chat", type:"nuevo-mensaje"}, "*"); } catch(e){} }
    var intentos = 0;
    (function hook(){
      intentos++;
      if (typeof io !== "undefined") {
        try { var s = io(); s.on("msg", avisar); s.on("new_message", avisar); return; } catch(e){}
      }
      if (intentos < 40) setTimeout(hook, 500);
    })();
  })();
  </script>
</body>
</html>
