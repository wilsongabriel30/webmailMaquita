# El chat DENTRO de otra aplicación (correo, plataforma, Drive), en el mismo origen.
#
# Estos bloques van en el vhost de esa aplicación. Con ellos, sus páginas pueden mostrar el
# chat, contar los mensajes sin leer y recibir los avisos en vivo sin salir de la sección.
#
# Sustituir 10.0.0.10 por la máquina del chat.

    # API del chat (conversaciones, mensajes, no leídos, lista de personas).
    location ^~ /api/chat/ {
        proxy_pass http://10.0.0.10:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 100M;
    }

    # Puerta dedicada: aquí se canjea el vale por la sesión propia del chat. Sin este bloque,
    # las páginas de la aplicación no consiguen sesión y el chat aparece vacío.
    location ^~ /chat/entrar {
        rewrite ^/chat/entrar(.*)$ /sso/entrar$1 break;
        proxy_pass http://10.0.0.10:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Páginas del chat (se enmarcan dentro de la aplicación).
    location ^~ /chat/ {
        proxy_pass http://10.0.0.10:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
    }

    # Tiempo real.
    location /socket.io/ {
        proxy_pass http://10.0.0.10:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Estáticos propios del chat (su interfaz y su biblioteca de GIF). Los prefijos son más
    # largos que /static/, así que ganan sobre los de la aplicación.
    location ^~ /static/js/chat-      { proxy_pass http://10.0.0.10:8790; expires 1h; }
    location ^~ /static/js/llamada-   { proxy_pass http://10.0.0.10:8790; expires 1h; }
    location ^~ /static/css/chat-     { proxy_pass http://10.0.0.10:8790; expires 1h; }
    location ^~ /static/gifs/         { proxy_pass http://10.0.0.10:8790; expires 30d; }
    location ^~ /static/grupos/       { proxy_pass http://10.0.0.10:8790; expires 7d; }
    location ^~ /static/uploads/chat/ { proxy_pass http://10.0.0.10:8790; proxy_set_header Host $host; expires 7d; }
