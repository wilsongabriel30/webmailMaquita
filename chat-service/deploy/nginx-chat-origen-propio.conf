# El chat en SU PROPIO origen (mensajeria.<dominio>).
#
# Sirve para el cliente de escritorio y para quien quiera abrirlo suelto. Al no compartir
# origen con el correo, la cookie del correo ya no viaja hasta aquí: un fallo en el chat deja
# de poder leer el buzón. A cambio hace falta la puerta `/sso/entrar`, que canjea un vale de un
# solo uso por la sesión propia del chat.
#
# Sustituir: mensajeria.ejemplo.org, correo.ejemplo.org y 10.0.0.10 (máquina del chat).

server {
    listen 80;
    listen [::]:80;
    server_name mensajeria.ejemplo.org;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mensajeria.ejemplo.org;

    ssl_certificate     /etc/letsencrypt/live/mensajeria.ejemplo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mensajeria.ejemplo.org/privkey.pem;
    include snippets/tls-intermedio.conf;

    client_max_body_size 64M;

    # Solo el correo (y la plataforma, si la hay) pueden enmarcarlo. Sin esto, cualquiera
    # podría incrustar el chat en su página y engañar a la persona sobre dónde escribe.
    add_header Content-Security-Policy "frame-ancestors https://correo.ejemplo.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://10.0.0.10:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Tiempo real: presencia, mensajes y avisos. Sin este bloque el chat «funciona» pero no
    # avisa de nada hasta recargar.
    location /socket.io/ {
        proxy_pass http://10.0.0.10:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
