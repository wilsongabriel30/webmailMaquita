name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        # Versiones fijadas: black cambia de estilo entre versiones y rompía el CI sin que
        # cambiara el código. Subirlas a propósito, reformateando en el mismo commit.
        run: pip install "black==26.3.1" "isort==6.1.0"

      - name: Check formatting with black
        run: black --check app/

      - name: Check import order with isort
        run: isort --check --profile black app/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only
      ADMIN_JWT_SECRET: test-admin-jwt-secret-for-ci-only
      MASTER_PASSWORD: test-master-password-for-ci-only
      MAIL_DOMAIN: example.com
      IMAP_HOST: 127.0.0.1
      SMTP_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run migrations
        env:
          PGPASSWORD: test
        run: |
          # Las migraciones conceden permisos al rol de la aplicacion; en una base recien
          # creada no existe y el GRANT abortaria todo. Se crea vacio, como en la instalacion.
          psql -h localhost -U test -d testdb -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='mailserver') THEN CREATE ROLE mailserver NOLOGIN; END IF; END \$\$;"
          for f in $(ls ../migrations/*.sql 2>/dev/null | sort); do
            echo "-> $f"
            psql -h localhost -U test -d testdb -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run tests
        run: pytest --tb=short -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # eslint bloquea SOLO en archivos del frontend cambiados vs main (merge-base),
      # coherente con el pre-commit sobre staged. La deuda preexistente (393+50, 0 de
      # seguridad) se limpia por lotes aparte; no rompe CI.
      - name: ESLint (solo archivos cambiados)
        working-directory: ${{ github.workspace }}
        run: |
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1)
          echo "Base de comparacion: $BASE"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'frontend/**/*.ts' 'frontend/**/*.tsx' 'frontend/**/*.js' 'frontend/**/*.jsx' | sed 's|^frontend/||')
          if [ -z "$FILES" ]; then echo "Sin archivos de frontend cambiados; nada que lintear."; exit 0; fi
          echo "Archivos a lintear:"; echo "$FILES"
          cd frontend && npx eslint $FILES

  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Run migrations
        env:
          PGPASSWORD: test
        run: |
          if ls migrations/*.sql 1>/dev/null 2>&1; then
            for f in $(ls migrations/*.sql | sort); do
              echo "Applying $f ..."
              psql -h localhost -U test -d migration_test -f "$f"
            done
          else
            echo "No migrations found, skipping"
          fi

      - name: Verify tables exist
        env:
          PGPASSWORD: test
        run: |
          TABLES=$(psql -h localhost -U test -d migration_test -t -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';" | tr -d " ")
          echo "Tables created: $TABLES"
          [ "$TABLES" -ge 20 ] || { echo "::error::Solo $TABLES tablas: las migraciones no crearon el esquema"; exit 1; }

  chat-test:
    name: Chat Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-service
    env:
      CHAT_JWT_SECRET: secreto-de-pruebas-del-chat-2026
      CHAT_SSO_SECRET: secreto-sso-de-pruebas-2026
      CHAT_SESSION_KEY: clave-de-sesion-de-pruebas-2026
      NOTIF_SECRET: secreto-de-servicios-de-pruebas-2026
      CHAT_SOCKETIO_ASYNC_MODE: threading
      DATABASE_URL: postgresql://prueba:prueba@127.0.0.1:1/prueba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests --tb=short -q

  install-smoke:
    name: Install Smoke Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mailserver
          POSTGRES_PASSWORD: test
          POSTGRES_DB: maildb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailserver"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sintaxis de los scripts de instalacion
        run: |
          for sc in deploy/webmail/instalar.sh deploy-webmail.sh deploy/webmail/probar-ia.sh deploy/tools/validar-despliegue.sh; do
            echo "bash -n $sc"; bash -n "$sc"
          done

      - name: Esquema + seeds aplican en PostgreSQL limpio
        env:
          PGPASSWORD: test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U mailserver -d maildb -c "CREATE EXTENSION IF NOT EXISTS vector"
          for fsql in migrations/*.sql deploy/seeds/*.sql; do
            [ -e "$fsql" ] || continue
            echo "-> $fsql"
            psql -h localhost -U mailserver -d maildb -v ON_ERROR_STOP=1 -f "$fsql" >/dev/null
          done
          echo "Tablas clave creadas:"
          psql -h localhost -U mailserver -d maildb -tAc "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('mailbox','rag_domains','rag_chunks','conditional_access_policies')"

      - name: Compilar (py_compile) backend, panel y servicios satelite
        run: |
          python -m py_compile $(find backend/app admin-panel/backend/app chat-service/app almacen/servicio milter -name '*.py' -not -name '*.bak.*')
          echo "py_compile OK"

      - name: Dependencias fijadas en todos los requirements
        run: |
          fallo=0
          for f in $(find . -name 'requirements*.txt' -not -path '*/node_modules/*' -not -path '*/venv/*' -not -path './backup-*' -not -name '*.bak*'); do
            sueltas=$(grep -vE '^\s*#|^\s*$' "$f" | grep -vc '==' || true)
            if [ "$sueltas" -gt 0 ]; then
              echo "::error file=$f::$sueltas dependencia(s) sin version fija"; fallo=1
            fi
          done
          [ "$fallo" = 0 ] && echo "Todas las dependencias estan fijadas"
          exit $fallo
