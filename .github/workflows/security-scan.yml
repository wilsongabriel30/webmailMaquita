name: Security Scan

on:
  push:
    branches: [main, develop, 'remediacion-*']
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  datos-personales:
    name: Datos personales en el repositorio
    # El 2026-09-01 entro al repositorio publico un fichero con 193 correos y
    # nombres reales. gitleaks busca secretos, no personas: este barrido busca
    # directorios de personas, cedulas, telefonos y volcados. Es BLOQUEANTE.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Barrido de datos personales (todo el arbol)
        run: python3 deploy/tools/barrido-datos-personales.py --arbol .

  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      # Bloquea por severidad High. Los hallazgos Medium (64 el 2026-09-06, casi todos
      # B608 de baja confianza sobre listas blancas) se muestran como informe hasta el
      # triage agendado tras la fusión de la remediación 2026-09.
      - name: Run bandit (High bloqueante)
        run: bandit -r backend/app/ -lll -x backend/app/compliance/content_extractor.py
      - name: Bandit informe Medium (no bloquea; triage agendado 2026-09-06)
        continue-on-error: true
        run: bandit -r backend/app/ -ll -x backend/app/compliance/content_extractor.py

  pip-audit:
    name: pip-audit (${{ matrix.modulo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulo:
          - backend
          - chat-service
          - almacen
          - almacen/aplicaciones/bi
          - almacen/aplicaciones/pdf_editor
          - admin-panel/backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r ${{ matrix.modulo }}/requirements.txt

  npm-audit:
    name: npm audit (${{ matrix.modulo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulo:
          - frontend
          - admin-panel/frontend
          - pruebas-navegador
    defaults:
      run:
        working-directory: ${{ matrix.modulo }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # pruebas-navegador solo tiene dependencias de desarrollo: se audita completo.
      - name: npm audit (altas y críticas)
        run: |
          if [ "${{ matrix.modulo }}" = "pruebas-navegador" ]; then
            npm audit --audit-level=high
          else
            npm audit --audit-level=high --omit=dev
          fi

  semgrep:
    name: Semgrep (SAST Python + TypeScript/React)
    # Cubre lo que Bandit no ve: el frontend y las reglas de FastAPI/OWASP.
    # MODO INFORME: no bloquea hasta terminar el triage de los primeros hallazgos.
    # Edición comunitaria, sin cuenta ni plataforma externa (sin métricas).
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.177.0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep
        run: >
          semgrep scan --metrics=off --sarif --output semgrep.sarif
          --config p/python --config p/typescript --config p/react
          --config p/owasp-top-ten --config p/dockerfile
          --config .semgrep/

      - name: Subir resultados a la pestaña Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

  trivy-imagenes:
    name: Trivy Imágenes (Dockerfiles)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen del chat
        run: docker build -t chat-maquita:ci chat-service/

      # Bloquea SOLO por avisos con corrección disponible (D-9): lo que Debian no arregla
      # (p. ej. CVE-2023-45853, zlib/minizip) se acepta con motivo y no rompe el CI.
      - name: Trivy sobre la imagen del chat (altos y críticos con fix)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: chat-maquita:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Construir la imagen de Z-Push
        run: docker build -t zpush:ci deploy/z-push/

      - name: Trivy sobre la imagen de Z-Push (altos y críticos con fix)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: zpush:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Trivy sobre los Dockerfiles (configuración; informa, no bloquea)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
