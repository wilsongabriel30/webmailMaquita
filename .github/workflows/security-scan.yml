name: Security Scan

on:
  push:
    branches: [main, develop, 'remediacion-*']
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  datos-personales:
    name: Datos personales en el repositorio
    # El 2026-09-01 entro al repositorio publico un fichero con 193 correos y
    # nombres reales. gitleaks busca secretos, no personas: este barrido busca
    # directorios de personas, cedulas, telefonos y volcados. Es BLOQUEANTE.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Barrido de datos personales (todo el arbol)
        run: python3 deploy/tools/barrido-datos-personales.py --arbol .

  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      # Bloquea por severidad High. Los hallazgos Medium (64 el 2026-09-06, casi todos
      # B608 de baja confianza sobre listas blancas) se muestran como informe hasta el
      # triage agendado tras la fusión de la remediación 2026-09.
      - name: Run bandit (High bloqueante)
        run: bandit -r backend/app/ -lll -x backend/app/compliance/content_extractor.py
      - name: Bandit informe Medium (no bloquea; triage agendado 2026-09-06)
        continue-on-error: true
        run: bandit -r backend/app/ -ll -x backend/app/compliance/content_extractor.py

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (critical only)
        run: npm audit --audit-level=high --omit=dev

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
