name: Documentation Issue
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong or missing in the documentation?
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Document or Section
      description: Which file or section is affected?
      placeholder: "docs/INSTALL.md, section 'Database Setup'"
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: How should the documentation be changed?
