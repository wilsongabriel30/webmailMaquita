name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the information below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version are you running? (git tag or commit hash)
      placeholder: "v1.0.1"
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Frontend (webmail UI)
        - Backend (API)
        - Compliance / eDiscovery
        - Calendar / Contacts
        - Admin panel
        - Docker / deployment
        - Documentation
        - Other
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Python/Node version, etc.
      placeholder: "Debian 12, Python 3.12, Firefox 128"
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output (no secrets or credentials).
      render: shell
