# ============================================================================
# Almacén Maquita — bloques nginx (agregar DENTRO del server{} del webmail)
# ============================================================================

# API del Almacén y página del editor (servicio gunicorn en 127.0.0.1:8788)
location /api/almacen/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 0;           # las subidas grandes las limita el servicio
    proxy_request_buffering off;      # streaming de subidas directo al servicio
    proxy_read_timeout 600s;          # el callback de guardado de OnlyOffice no debe morir
    proxy_send_timeout 600s;
}

location /archivos-almacen/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# Estaticos del explorador del Almacen (CSS/JS). SIN ESTO el Drive sale deforme (404 en CSS).
location /almacen-static/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# Otras rutas de nivel superior que sirve el Almacen (landing y atajo del Drive).
location = /webmail-inicio { proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
location /drive { proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }

# Login de cuentas externas (pasantes/aliados) — publico; X-Real-IP para el rate-limit.
location /acceso-externo { proxy_pass http://127.0.0.1:8788; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto https; }

# Enlaces compartidos del Almacén (página pública de descarga, sin login;
# su seguridad es el token del enlace + clave y expiración opcionales)
location /almacen-s/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# ---------------------------------------------------------------------------
# OnlyOffice Document Server bajo el MISMO dominio (evita problemas de
# iframe/CORS). El DS corre en docker en ESTE u otro servidor (puerto 8080).
# X-Forwarded-Host con subruta => el DS genera TODAS sus URLs bajo /office/.
# ---------------------------------------------------------------------------
location /office/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host/office;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "frame-ancestors 'self';" always;
    proxy_buffering off;
    client_max_body_size 0;
    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
}
