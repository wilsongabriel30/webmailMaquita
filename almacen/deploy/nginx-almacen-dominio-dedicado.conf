# ============================================================================
# Almacén (Drive Maquita) — PATRÓN RECOMENDADO: dominio/subdominio DEDICADO
# ----------------------------------------------------------------------------
# En vez de montar el Drive por subrutas dentro del webmail, se le da su propio
# nombre (p. ej. drive.suorganizacion.tld). Todo el dominio va al servicio del
# Almacén (127.0.0.1:8788): sin choques de rutas y con SSO por subdominios si se
# comparte cookie_domain con el webmail. Ajusta server_name y las rutas TLS.
# ============================================================================
server {
    listen 443 ssl http2;
    server_name drive.suorganizacion.tld;   # <-- CAMBIAR

    ssl_certificate     /etc/letsencrypt/live/drive.suorganizacion.tld/fullchain.pem;   # <-- CAMBIAR
    ssl_certificate_key /etc/letsencrypt/live/drive.suorganizacion.tld/privkey.pem;     # <-- CAMBIAR

    client_max_body_size 0;            # las subidas grandes las limita el servicio
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # OnlyOffice (si se usa) bajo el mismo dominio, en /office/
    location /office/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host/office;
        proxy_hide_header X-Frame-Options;
        proxy_buffering off;
    }
}
