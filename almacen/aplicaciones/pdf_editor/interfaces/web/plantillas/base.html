<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% block titulo %}Editor de PDF{% endblock %}{% endblock %}</title>

    <!-- Base autónoma del Editor de PDF (Aplicación del Drive Maquita).
         NO depende de Raíces: define los bloques que usan las 4 plantillas
         (title/titulo, extra_css/estilos, content/contenido, extra_js/scripts)
         y carga Bootstrap + bootstrap-icons desde los estáticos propios. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-5.3.2/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/font/bootstrap-icons.min.css') }}">
    {% block extra_head %}{% endblock %}
    {% block extra_css %}{% endblock %}
    {% block estilos %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    {% block contenido %}{% endblock %}

    <script src="{{ url_for('static', filename='vendor/bootstrap-5.3.2/js/bootstrap.bundle.min.js') }}"></script>
    {% block extra_js %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
